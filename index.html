function maintFieldLabel(category, key) {
  const defs = MAINT_FIELD_DEFS[category] || [];
  const f = defs.find((d) => d.key === key);
  return f ? f.label : key;
}

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

function fmtDate(d) {
  if (!d) return "";
  const dt = new Date(d);
  return `${dt.getFullYear()}/${dt.getMonth() + 1}/${dt.getDate()}`;
}

function yearOf(d) {
  if (!d) return null;
  return new Date(d).getFullYear();
}

function MaintTab({ records, setRecords, mileage }) {
  const blankMeta = {
    date: new Date().toISOString().slice(0, 10),
    mileage: mileage || "",
    cost: "",
    memo: "",
  };
  const [meta, setMeta] = useState(blankMeta);
  const [items, setItems] = useState([]);
  const [currentCategory, setCurrentCategory] = useState("");
  const [currentDetails, setCurrentDetails] = useState({});
  const [currentCustomName, setCurrentCustomName] = useState("");
  const [error, setError] = useState("");
  const [showForm, setShowForm] = useState(false);
  const [editingId, setEditingId] = useState(null);
  const [editingItemIndex, setEditingItemIndex] = useState(null);
  const [selectedYear, setSelectedYear] = useState("all");
  const [photoStatus, setPhotoStatus] = useState("");
  const [photoWarnings, setPhotoWarnings] = useState([]);

  const resetAll = () => {
    setMeta({ ...blankMeta, mileage: mileage || "" });
    setItems([]);
    setCurrentCategory("");
    setCurrentDetails({});
    setCurrentCustomName("");
    setError("");
    setEditingId(null);
    setEditingItemIndex(null);
    setPhotoStatus("");
    setPhotoWarnings([]);
  };

  const readPhoto = async (event) => {
    const file = event.target.files && event.target.files[0];
    event.target.value = "";
    if (!file) return;
    try {
      setError("");
      setPhotoWarnings([]);
      setPhotoStatus("写真を準備中…");
      const prepared = await preparePhotoForAi(file);
      setPhotoStatus("AIが読み取り中…（少し時間がかかります）");
      const result = await analyzeMaintenancePhoto(prepared.data, prepared.mimeType);
      const draft = result && result.draft;
      if (!draft) throw new Error("読み取り結果が空でした");
      setMeta((prev) => ({
        ...prev,
        date: draft.date || prev.date,
        mileage: draft.mileage === null || draft.mileage === undefined ? prev.mileage : String(draft.mileage),
        cost: draft.cost === null || draft.cost === undefined ? prev.cost : String(draft.cost),
        memo: draft.memo || prev.memo,
      }));
      const aiItems = (draft.items || []).filter((item) => item && item.category).map((item) => ({
        category: item.category,
        details: Array.isArray(item.details)
          ? item.details.reduce((obj, detail) => {
              if (detail && detail.key && detail.value) obj[detail.key] = detail.value;
              return obj;
            }, {})
          : { ...(item.details || {}) },
      }));
      if (aiItems.length) setItems(aiItems);
      setCurrentCategory("");
      setCurrentDetails({});
      setCurrentCustomName("");
      setEditingItemIndex(null);
      setPhotoWarnings(result.warnings || []);
      setPhotoStatus("読み取り完了。内容を確認してから保存してください");
    } catch (err) {
      setPhotoStatus("");
      setError("写真を読み取れませんでした：" + (err.message || err));
    }
  };

  const startEdit = (record) => {
    const editableItems = record.items ||
      (record.categories || [record.category])
        .filter(Boolean)
        .map((category) => ({ category, details: {} }));

    setMeta({
      date: record.date || new Date().toISOString().slice(0, 10),
      mileage: record.mileage || "",
      cost: record.cost || "",
      memo: record.memo || "",
    });
    setItems(
      editableItems.map((item) => ({
        ...item,
        details: { ...(item.details || {}) },
      }))
    );
    setCurrentCategory("");
    setCurrentDetails({});
    setCurrentCustomName("");
    setError("");
    setEditingId(record.id);
    setEditingItemIndex(null);
    setShowForm(true);
    window.scrollTo({ top: 0, behavior: "smooth" });
  };

  const pickCategory = (c) => {
    setCurrentCategory(c);
    setCurrentDetails({});
    setCurrentCustomName("");
    setError("");
  };

  const addItem = () => {
    if (!currentCategory) return;
    if (currentCategory === "その他" && !currentCustomName.trim()) {
      setError("項目名を入力してください");
      return;
    }
    const label = currentCategory === "その他" ? currentCustomName.trim() : currentCategory;
    const nextItem = { category: label, details: currentDetails };
    if (editingItemIndex !== null) {
      setItems(items.map((item, index) => index === editingItemIndex ? nextItem : item));
    } else {
      setItems([...items, nextItem]);
    }
    setCurrentCategory("");
    setCurrentDetails({});
    setCurrentCustomName("");
    setError("");
    setEditingItemIndex(null);
  };

  const editItem = (item, index) => {
    const isPreset = MAINT_CATEGORIES.includes(item.category);
    setCurrentCategory(isPreset ? item.category : "その他");
    setCurrentCustomName(isPreset ? "" : item.category);
    setCurrentDetails({ ...(item.details || {}) });
    setEditingItemIndex(index);
    setError("");
  };

  const removeItem = (idx) => {
    setItems(items.filter((_, i) => i !== idx));
    if (editingItemIndex === idx) {
      setCurrentCategory("");
      setCurrentDetails({});
      setCurrentCustomName("");
      setEditingItemIndex(null);
    }
  };

  const save = () => {
    if (items.length === 0) {
      setError("項目を1つ以上追加してください");
      return;
    }
    if (!meta.date) {
      setError("日付を入力してください");
      return;
    }
    if (meta.mileage !== "" && Number(meta.mileage) < 0) {
      setError("走行距離は0以上で入力してください");
      return;
    }
    if (meta.cost !== "" && Number(meta.cost) < 0) {
      setError("費用は0以上で入力してください");
      return;
    }
    setError("");
    if (editingId) {
      setRecords(
        records.map((record) =>
          record.id === editingId ? { ...record, ...meta, items } : record
        )
      );
    } else {
      setRecords([{ id: uid(), ...meta, items }, ...records]);
    }
    resetAll();
    setShowForm(false);
  };

  const remove = (id) => {
    if (!window.confirm("この整備記録を削除しますか？")) return;
    setRecords(records.filter((r) => r.id !== id));
  };

  const sorted = [...records].sort((a, b) => (a.date < b.date ? 1 : -1));
  const years = Array.from(new Set(records.map((r) => yearOf(r.date)).filter(Boolean))).sort(
    (a, b) => b - a
  );
  const filtered =
    selectedYear === "all" ? sorted : sorted.filter((r) => yearOf(r.date) === selectedYear);

  const currentFieldDefs = MAINT_FIELD_DEFS[currentCategory] || [];

  return (
    <div>
      <div
        style={{
          display: "flex",
          alignItems: "center",
          justifyContent: "space-between",
          marginBottom: 14,
        }}
      >
        <div style={{ fontSize: 20, fontWeight: 700 }}>
          {records.length}
          <span style={{ fontSize: 12, color: COLORS.textMuted, marginLeft: 4 }}>
            件の記録
          </span>
        </div>
        <button
          onClick={() => {
            if (showForm) {
              setShowForm(false);
            } else {
              resetAll();
              setShowForm(true);
            }
          }}
          style={{
            background: showForm ? COLORS.surfaceRaised : COLORS.red,
            border: `1px solid ${showForm ? COLORS.border : COLORS.red}`,
            color: "#fff",
            borderRadius: 7,
            padding: "9px 14px",
            fontSize: 13,
            fontWeight: 700,
            display: "flex",
            alignItems: "center",
            gap: 5,
            cursor: "pointer",
          }}
        >
          <Plus size={15} />
          記録を追加
        </button>
      </div>

      <YearFilter years={years} selected={selectedYear} setSelected={setSelectedYear} />

      {showForm && (
        <div
          style={{
            background: COLORS.surface,
            border: `1px solid ${COLORS.border}`,
            borderRadius: 10,
            padding: 14,
            marginBottom: 16,
          }}
        >
          {editingId && (
            <div
              style={{
                fontSize: 12,
                color: COLORS.amber,
                marginBottom: 10,
                fontWeight: 600,
              }}
            >
              整備記録を編集中
            </div>
          )}
          <div style={{ marginBottom: 12 }}>
            <label style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 7, border: `1px solid ${COLORS.amber}`, color: COLORS.amber, background: COLORS.bg, borderRadius: 7, padding: "10px 8px", fontSize: 13, fontWeight: 700, cursor: "pointer" }}>
              📷 写真から自動入力
              <input type="file" accept="image/*" capture="environment" onChange={readPhoto} style={{ display: "none" }} />
            </label>
            {photoStatus && <div style={{ color: COLORS.green, fontSize: 11, marginTop: 6 }}>{photoStatus}</div>}
            {photoWarnings.map((warning, index) => (
              <div key={index} style={{ color: COLORS.amber, fontSize: 11, marginTop: 3 }}>⚠ {warning}</div>
            ))}
          </div>
          <div style={{ display: "flex", gap: 10 }}>
            <div style={{ flex: 1 }}>
              <Field label="日付">
                <input
                  type="date"
                  value={meta.date}
                  onChange={(e) => setMeta({ ...meta, date: e.target.value })}
                  style={inputStyle}
                />
              </Field>
            </div>
            <div style={{ flex: 1 }}>
              <Field label="走行距離 (km)">
                <input
                  type="number"
                  value={meta.mileage}
                  onChange={(e) => setMeta({ ...meta, mileage: e.target.value })}
                  style={inputStyle}
                  placeholder="45000"
                />
              </Field>
            </div>
          </div>

          {items.length > 0 && (
            <div style={{ marginBottom: 12 }}>
              <div style={{ fontSize: 11, color: COLORS.textMuted, marginBottom: 6 }}>
                追加した項目
              </div>
              {items.map((it, idx) => (
                <div
                  key={idx}
                  style={{
                    display: "flex",
                    justifyContent: "space-between",
                    alignItems: "flex-start",
                    background: COLORS.surfaceRaised,
                    border: `1px solid ${COLORS.border}`,
                    borderRadius: 7,
                    padding: "8px 10px",
                    marginBottom: 6,
                  }}
                >
                  <div>
                    <div style={{ fontSize: 13, fontWeight: 600 }}>{it.category}</div>
                    {Object.entries(it.details)
                      .filter(([, v]) => v)
                      .map(([k, v]) => (
                        <div key={k} style={{ fontSize: 11, color: COLORS.textMuted }}>
                          {maintFieldLabel(it.category, k)}: {v}
                        </div>
                      ))}
                  </div>
                  <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                    <button
                      type="button"
                      onClick={() => editItem(it, idx)}
                      style={{
                        background: "transparent",
                        border: `1px solid ${COLORS.border}`,
                        borderRadius: 5,
                        color: COLORS.textMuted,
                        cursor: "pointer",
                        padding: "3px 6px",
                        fontSize: 10,
                      }}
                    >
                      編集
                    </button>
                    <button
                      type="button"
                      onClick={() => removeItem(idx)}
                      style={{
                        background: "transparent",
                        border: "none",
                        color: COLORS.textMuted,
                        cursor: "pointer",
                        padding: 2,
                      }}
                      aria-label="削除"
                    >
                      <X size={14} />
                    </button>
                  </div>
                </div>
              ))}
            </div>
          )}

          <Field label={items.length > 0 ? "項目を追加" : "整備項目"}>
            <div
              style={{
                display: "grid",
                gridTemplateColumns: "1fr 1fr",
                gap: 6,
              }}
            >
              {MAINT_CATEGORIES.map((c) => {
                const active = currentCategory === c;
                return (
                  <button
                    type="button"
                    key={c}
                    onClick={() => pickCategory(active ? "" : c)}
                    style={{
                      textAlign: "left",
                      fontSize: 12.5,
                      padding: "8px 9px",
                      borderRadius: 7,
                      border: `1px solid ${active ? COLORS.red : COLORS.border}`,
                      background: active ? COLORS.redDim : COLORS.bg,
                      color: active ? "#fff" : COLORS.text,
                      cursor: "pointer",
                    }}
                  >
                    {c}
                  </button>
                );
              })}
            </div>
          </Field>

          {currentCategory && (
            <div
              style={{
                background: COLORS.bg,
                border: `1px solid ${COLORS.border}`,
                borderRadius: 8,
                padding: 10,
                marginBottom: 12,
              }}
            >
              {currentCategory === "その他" && (
                <Field label="項目名">
                  <input
                    value={currentCustomName}
                    onChange={(e) => setCurrentCustomName(e.target.value)}
                    style={inputStyle}
                    placeholder="例: マフラー交換"
                  />
                </Field>
              )}

              {currentFieldDefs.map((f) => (
                <Field key={f.key} label={f.label}>
                  <input
                    value={currentDetails[f.key] || ""}
                    onChange={(e) =>
                      setCurrentDetails({ ...currentDetails, [f.key]: e.target.value })
                    }
                    style={inputStyle}
                    placeholder={f.placeholder}
                  />
                </Field>
              ))}

              <button
                type="button"
                onClick={addItem}
                style={{
                  width: "100%",
                  background: COLORS.surfaceRaised,
                  border: `1px solid ${COLORS.border}`,
                  color: COLORS.text,
                  borderRadius: 7,
                  padding: "8px 0",
                  fontSize: 13,
                  fontWeight: 700,
                  display: "flex",
                  alignItems: "center",
                  justifyContent: "center",
                  gap: 6,
                  cursor: "pointer",
                }}
              >
                <Plus size={14} />
                {editingItemIndex !== null ? "この項目を更新" : "この項目を追加"}
              </button>
            </div>
          )}

          {error && (
            <div style={{ color: "#e08585", fontSize: 12, marginBottom: 10 }}>{error}</div>
          )}

          <Field label="費用 合計(円)">
            <input
              type="number"
              value={meta.cost}
              onChange={(e) => setMeta({ ...meta, cost: e.target.value })}
              style={inputStyle}
              placeholder="8000"
            />
          </Field>

          <Field label="メモ">
            <input
              value={meta.memo}
              onChange={(e) => setMeta({ ...meta, memo: e.target.value })}
              style={inputStyle}
              placeholder="任意"
            />
          </Field>

          <button
            onClick={save}
            style={{
              width: "100%",
              background: COLORS.red,
              border: "none",
              color: "#fff",
              borderRadius: 7,
              padding: "10px 0",
              fontSize: 14,
              fontWeight: 700,
              display: "flex",
              alignItems: "center",
              justifyContent: "center",
              gap: 6,
              cursor: "pointer",
            }}
          >
            <Plus size={16} />
            {editingId ? "更新する" : "記録を保存"}
          </button>
        </div>
      )}

      {filtered.length === 0 && <EmptyState text="整備記録はまだありません" />}

      {filtered.map((r) => (
        <div
          key={r.id}
          style={{
            background: COLORS.surface,
            border: `1px solid ${COLORS.border}`,
            borderRadius: 10,
            padding: 12,
            marginBottom: 8,
          }}
        >
          <div
            style={{
              display: "flex",
              justifyContent: "space-between",
              alignItems: "flex-start",
            }}
          >
            <div style={{ flex: 1 }}>
              {(r.items || (r.categories || [r.category]).filter(Boolean).map((c) => ({ category: c, details: {} }))).map(
                (it, idx) => (
                  <div key={idx} style={{ marginBottom: 4 }}>
                    <span
                      style={{
                        fontSize: 11,
                        fontWeight: 600,
                        padding: "2px 7px",
                        borderRadius: 5,
                        background: COLORS.surfaceRaised,
                        border: `1px solid ${COLORS.border}`,
                      }}
                    >
                      {it.category}
                    </span>
                    {Object.entries(it.details || {})
                      .filter(([, v]) => v)
                      .map(([k, v]) => (
                        <div
                          key={k}
                          style={{ fontSize: 11, color: COLORS.textMuted, marginTop: 2 }}
                        >
                          {maintFieldLabel(it.category, k)}: {v}
                        </div>
                      ))}
                  </div>
                )
              )}
              <div
                style={{
                  fontSize: 12,
                  color: COLORS.textMuted,
                  display: "flex",
                  gap: 10,
                  marginTop: 4,
                }}
              >
                <span>
                  <Calendar
                    size={11}
                    style={{ verticalAlign: -1, marginRight: 3 }}
                  />
                  {fmtDate(r.date)}
                </span>
                {r.mileage && (
                  <span style={{ fontFamily: "monospace" }}>
                    {Number(r.mileage).toLocaleString()}km
                  </span>
                )}
              </div>
              {r.memo && (
                <div style={{ fontSize: 12, color: COLORS.textMuted, marginTop: 4 }}>
                  {r.memo}
                </div>
              )}
            </div>
            <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
              {r.cost && (
                <span
                  style={{
                    fontFamily: "monospace",
                    fontSize: 13,
                    color: COLORS.amber,
                  }}
                >
                  ¥{Number(r.cost).toLocaleString()}
                </span>
              )}
              <button
                onClick={() => startEdit(r)}
                style={{
                  background: "transparent",
                  border: `1px solid ${COLORS.border}`,
                  borderRadius: 6,
                  color: COLORS.textMuted,
                  cursor: "pointer",
                  padding: "4px 7px",
                  fontSize: 11,
                }}
                aria-label="編集"
              >
                編集
              </button>
              <button
                onClick={() => remove(r.id)}
                style={{
                  background: "transparent",
                  border: "none",
                  color: COLORS.textMuted,
                  cursor: "pointer",
                  padding: 4,
                }}
                aria-label="削除"
              >
                <Trash2 size={15} />
              </button>
            </div>
          </div>
        </div>
      ))}
    </div>
  );
}

function CircuitTab({ records, setRecords }) {
  const blankForm = {
    date: new Date().toISOString().slice(0, 10),
    circuit: CIRCUITS[0],
    customCircuit: "",
    lapMin: "",
    lapSec: "",
    weather: "晴れ",
    temp: "",
    tireF: "",
    tireR: "",
    memo: "",
  };
  const [form, setForm] = useState(blankForm);
  const [showForm, setShowForm] = useState(false);
  const [editingId, setEditingId] = useState(null);
  const [error, setError] = useState("");
  const [selectedYear, setSelectedYear] = useState("all");
  const [viewMode, setViewMode] = useState("date");

  const startAdd = () => {
    setForm(blankForm);
    setEditingId(null);
    setError("");
    setShowForm(true);
  };

  const startEdit = (record) => {
    const isPresetCircuit = CIRCUITS.includes(record.circuit);
    let lapMin = record.lapMin || "";
    let lapSec = record.lapSec || "";

    if (!lapMin && !lapSec && record.bestLap) {
      const parts = String(record.bestLap).split(":");
      if (parts.length === 2) {
        lapMin = parts[0];
        lapSec = parts[1];
      }
    }

    setForm({
      date: record.date || new Date().toISOString().slice(0, 10),
      circuit: isPresetCircuit ? record.circuit : "その他",
      customCircuit: isPresetCircuit ? "" : record.circuit || "",
      lapMin,
      lapSec,
      weather: record.weather || "晴れ",
      temp: record.temp || "",
      tireF: record.tireF || "",
      tireR: record.tireR || "",
      memo: record.memo || "",
    });
    setEditingId(record.id);
    setError("");
    setShowForm(true);
    window.scrollTo({ top: 0, behavior: "smooth" });
  };

  const save = () => {
    if (!form.date) {
      setError("日付を入力してください");
      return;
    }
    if (form.circuit === "その他" && !form.customCircuit.trim()) {
      setError("サーキット名を入力してください");
      return;
    }
    const lapMinutes = Number(form.lapMin || 0);
    const lapSeconds = Number(form.lapSec || 0);
    if (lapMinutes < 0 || lapSeconds < 0 || lapSeconds >= 60) {
      setError("ラップタイムは0分以上、秒は0〜59.999で入力してください");
      return;
    }
    if ((form.tireF !== "" && (Number(form.tireF) < 50 || Number(form.tireF) > 500)) ||
        (form.tireR !== "" && (Number(form.tireR) < 50 || Number(form.tireR) > 500))) {
      setError("タイヤ空気圧は50〜500kPaで入力してください");
      return;
    }
    setError("");
    const circuit =
      form.circuit === "その他" && form.customCircuit
        ? form.customCircuit
        : form.circuit;
    let bestLap = "";
    if (form.lapMin !== "" || form.lapSec !== "") {
      const m = Number(form.lapMin) || 0;
      const s = Number(form.lapSec) || 0;
      bestLap = `${m}:${s.toFixed(3).padStart(6, "0")}`;
    }
    const savedRecord = { ...form, circuit, bestLap };
    if (editingId) {
      setRecords(
        records.map((record) =>
          record.id === editingId ? { ...record, ...savedRecord } : record
        )
      );
    } else {
      setRecords([{ id: uid(), ...savedRecord }, ...records]);
    }
    setForm(blankForm);
    setEditingId(null);
    setShowForm(false);
  };

  const remove = (id) => {
    if (!window.confirm("このサーキット記録を削除しますか？")) return;
    setRecords(records.filter((r) => r.id !== id));
  };
  const sorted = [...records].sort((a, b) => (a.date < b.date ? 1 : -1));
  const years = Array.from(new Set(records.map((r) => yearOf(r.date)).filter(Boolean))).sort(
    (a, b) => b - a
  );
  const filtered =
    selectedYear === "all" ? sorted : sorted.filter((r) => yearOf(r.date) === selectedYear);

  const byCircuit = {};
  filtered.forEach((r) => {
    if (!byCircuit[r.circuit]) byCircuit[r.circuit] = [];
    byCircuit[r.circuit].push(r);
  });
  const circuitGroups = Object.keys(byCircuit)
    .map((name) => ({ name, items: byCircuit[name] }))
    .sort((a, b) => (a.items[0].date < b.items[0].date ? 1 : -1));

  const renderCard = (r) => (
    <div
      key={r.id}
      style={{
        background: COLORS.surface,
        border: `1px solid ${COLORS.border}`,
        borderRadius: 10,
        padding: 12,
        marginBottom: 8,
      }}
    >
      <div
        style={{
          display: "flex",
          justifyContent: "space-between",
          alignItems: "flex-start",
        }}
      >
        <div>
          {viewMode === "date" && (
            <div
              style={{
                fontWeight: 700,
                fontSize: 14,
                marginBottom: 2,
                display: "flex",
                alignItems: "center",
                gap: 5,
              }}
            >
              <MapPin size={12} color={COLORS.amber} />
              {r.circuit}
            </div>
          )}
          <div
            style={{
              fontSize: 12,
              color: COLORS.textMuted,
              display: "flex",
              gap: 10,
              flexWrap: "wrap",
              marginTop: viewMode === "date" ? 3 : 0,
            }}
          >
            <span>
              <Calendar size={11} style={{ verticalAlign: -1, marginRight: 3 }} />
              {fmtDate(r.date)}
            </span>
            <span>
              {r.weather}
              {r.temp ? ` ${r.temp}℃` : ""}
            </span>
            {(r.tireF || r.tireR) && (
              <span>
                <Fuel size={11} style={{ verticalAlign: -1, marginRight: 3 }} />
                {r.tireF || "-"}/{r.tireR || "-"}kPa
              </span>
            )}
          </div>
          {r.memo && (
            <div style={{ fontSize: 12, color: COLORS.textMuted, marginTop: 4 }}>
              {r.memo}
            </div>
          )}
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
          {r.bestLap && (
            <span
              style={{
                fontFamily: "monospace",
                fontSize: 14,
                fontWeight: 700,
                color: COLORS.amber,
                display: "flex",
                alignItems: "center",
                gap: 3,
              }}
            >
              <Timer size={12} />
              {r.bestLap}
            </span>
          )}
          <button
            onClick={() => startEdit(r)}
            style={{
              background: "transparent",
              border: `1px solid ${COLORS.border}`,
              borderRadius: 6,
              color: COLORS.textMuted,
              cursor: "pointer",
              padding: "4px 7px",
              fontSize: 11,
            }}
            aria-label="編集"
          >
            編集
          </button>
          <button
            onClick={() => remove(r.id)}
            style={{
              background: "transparent",
              border: "none",
              color: COLORS.textMuted,
              cursor: "pointer",
              padding: 4,
            }}
            aria-label="削除"
          >
            <Trash2 size={15} />
          </button>
        </div>
      </div>
    </div>
  );

  return (
    <div>
      <div
        style={{
          display: "flex",
          alignItems: "center",
          justifyContent: "space-between",
          marginBottom: 14,
        }}
      >
        <div style={{ fontSize: 20, fontWeight: 700 }}>
          {records.length}
          <span style={{ fontSize: 12, color: COLORS.textMuted, marginLeft: 4 }}>
            回走行
          </span>
        </div>
        <button
          onClick={() => {
            if (showForm) {
              setShowForm(false);
              setEditingId(null);
            } else {
              startAdd();
            }
          }}
          style={{
            background: showForm ? COLORS.surfaceRaised : COLORS.red,
            border: `1px solid ${showForm ? COLORS.border : COLORS.red}`,
            color: "#fff",
            borderRadius: 7,
            padding: "9px 14px",
            fontSize: 13,
            fontWeight: 700,
            display: "flex",
            alignItems: "center",
            gap: 5,
            cursor: "pointer",
          }}
        >
          <Plus size={15} />
          走行記録を追加
        </button>
      </div>

      <div style={{ display: "flex", gap: 6, marginBottom: 12 }}>
        <ViewModeButton
          active={viewMode === "date"}
          onClick={() => setViewMode("date")}
          label="日付順"
        />
        <ViewModeButton
          active={viewMode === "circuit"}
          onClick={() => setViewMode("circuit")}
          label="コース別"
        />
      </div>

      <YearFilter years={years} selected={selectedYear} setSelected={setSelectedYear} />

      {showForm && (
        <div
          style={{
            background: COLORS.surface,
            border: `1px solid ${COLORS.border}`,
            borderRadius: 10,
            padding: 14,
            marginBottom: 16,
          }}
        >
          {editingId && (
            <div
              style={{
                fontSize: 12,
                color: COLORS.amber,
                marginBottom: 10,
                fontWeight: 600,
              }}
            >
              サーキット記録を編集中
            </div>
          )}
          <div style={{ display: "flex", gap: 10 }}>
            <div style={{ flex: 1 }}>
              <Field label="日付">
                <input
                  type="date"
                  value={form.date}
                  onChange={(e) => setForm({ ...form, date: e.target.value })}
                  style={inputStyle}
                />
              </Field>
            </div>
            <div style={{ flex: 1 }}>
              <Field label="天候">
                <select
                  value={form.weather}
                  onChange={(e) => setForm({ ...form, weather: e.target.value })}
                  style={inputStyle}
                >
                  <option>晴れ</option>
                  <option>曇り</option>
                  <option>雨</option>
                  <option>ウェット路面</option>
                </select>
              </Field>
            </div>
          </div>

          <Field label="サーキット">
            <select
              value={form.circuit}
              onChange={(e) => setForm({ ...form, circuit: e.target.value })}
              style={inputStyle}
            >
              {CIRCUITS.map((c) => (
                <option key={c} value={c}>
                  {c}
                </option>
              ))}
            </select>
          </Field>

          {form.circuit === "その他" && (
            <Field label="サーキット名">
              <input
                value={form.customCircuit}
                onChange={(e) => setForm({ ...form, customCircuit: e.target.value })}
                style={inputStyle}
                placeholder="サーキット名を入力"
              />
            </Field>
          )}

          <Field label="ベストラップ">
            <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
              <input
                type="number"
                inputMode="numeric"
                min="0"
                value={form.lapMin}
                onChange={(e) => setForm({ ...form, lapMin: e.target.value })}
                style={{ ...inputStyle, fontFamily: "monospace", textAlign: "right" }}
                placeholder="1"
              />
              <span style={{ color: COLORS.textMuted, fontSize: 13 }}>分</span>
              <input
                type="number"
                inputMode="decimal"
                min="0"
                step="0.001"
                value={form.lapSec}
                onChange={(e) => setForm({ ...form, lapSec: e.target.value })}
                style={{ ...inputStyle, fontFamily: "monospace", textAlign: "right" }}
                placeholder="05.320"
              />
              <span style={{ color: COLORS.textMuted, fontSize: 13 }}>秒</span>
            </div>
          </Field>

          <div style={{ display: "flex", gap: 10 }}>
            <div style={{ flex: 1 }}>
              <Field label="気温 (℃)">
                <input
                  type="number"
                  value={form.temp}
                  onChange={(e) => setForm({ ...form, temp: e.target.value })}
                  style={inputStyle}
                  placeholder="22"
                />
              </Field>
            </div>
          </div>

          <div style={{ display: "flex", gap: 10 }}>
            <div style={{ flex: 1 }}>
              <Field label="タイヤ空気圧 前 (kPa)">
                <input
                  type="number"
                  value={form.tireF}
                  onChange={(e) => setForm({ ...form, tireF: e.target.value })}
                  style={inputStyle}
                  placeholder="220"
                />
              </Field>
            </div>
            <div style={{ flex: 1 }}>
              <Field label="タイヤ空気圧 後 (kPa)">
                <input
                  type="number"
                  value={form.tireR}
                  onChange={(e) => setForm({ ...form, tireR: e.target.value })}
                  style={inputStyle}
                  placeholder="210"
                />
              </Field>
            </div>
          </div>

          <Field label="メモ">
            <input
              value={form.memo}
              onChange={(e) => setForm({ ...form, memo: e.target.value })}
              style={inputStyle}
              placeholder="セッティングやコンディションなど"
            />
          </Field>

          {error && (
            <div style={{ color: "#e08585", fontSize: 12, marginBottom: 10 }}>{error}</div>
          )}

          <button
            onClick={save}
            style={{
              width: "100%",
              background: COLORS.red,
              border: "none",
              color: "#fff",
              borderRadius: 7,
              padding: "10px 0",
              fontSize: 14,
              fontWeight: 700,
              display: "flex",
              alignItems: "center",
              justifyContent: "center",
              gap: 6,
              cursor: "pointer",
            }}
          >
            <Plus size={16} />
            {editingId ? "更新する" : "保存する"}
          </button>
        </div>
      )}

      {filtered.length === 0 && <EmptyState text="サーキット走行記録はまだありません" />}

      {viewMode === "date" && filtered.map((r) => renderCard(r))}

      {viewMode === "circuit" &&
        circuitGroups.map((g) => (
          <div key={g.name} style={{ marginBottom: 14 }}>
            <div
              style={{
                fontSize: 11,
                color: COLORS.textMuted,
                marginBottom: 6,
                display: "flex",
                alignItems: "center",
                gap: 5,
              }}
            >
              <MapPin size={11} />
              {g.name}
              <span style={{ color: COLORS.textMuted }}>({g.items.length}回)</span>
            </div>
            {g.items.map((r) => renderCard(r))}
          </div>
        ))}
    </div>
  );
}

function ViewModeButton({ active, onClick, label }) {
  return (
    <button
      onClick={onClick}
      style={{
        flex: 1,
        fontSize: 12.5,
        fontWeight: 600,
        padding: "8px 0",
        borderRadius: 7,
        border: `1px solid ${active ? COLORS.red : COLORS.border}`,
        background: active ? COLORS.redDim : "transparent",
        color: active ? "#fff" : COLORS.textMuted,
        cursor: "pointer",
      }}
    >
      {label}
    </button>
  );
}

function CustomTab({ records, setRecords, highlightId, onHighlightHandled }) {
  const blankForm = {
    date: new Date().toISOString().slice(0, 10),
    category: CUSTOM_CATEGORIES[0],
    part: "",
    brand: "",
    cost: "",
    memo: "",
    status: "active",
  };
  const [form, setForm] = useState(blankForm);
  const [error, setError] = useState("");
  const [showForm, setShowForm] = useState(false);
  const [editingId, setEditingId] = useState(null);
  const [flashId, setFlashId] = useState(null);
  const cardRefs = useRef({});

  useEffect(() => {
    if (!highlightId) return;
    const el = cardRefs.current[highlightId];
    if (el) {
      el.scrollIntoView({ behavior: "smooth", block: "center" });
    }
    setFlashId(highlightId);
    const t = setTimeout(() => setFlashId(null), 1800);
    if (onHighlightHandled) onHighlightHandled();
    return () => clearTimeout(t);
  }, [highlightId]);

  const startEdit = (r) => {
    setForm({
      date: r.date,
      category: r.category,
      part: r.part,
      brand: r.brand || "",
      cost: r.cost || "",
      memo: r.memo || "",
      status: r.status || "active",
    });
    setEditingId(r.id);
    setError("");
    setShowForm(true);
  };

  const startAdd = () => {
    setForm(blankForm);
    setEditingId(null);
    setError("");
    setShowForm(true);
  };

  const save = () => {
    if (!form.part.trim()) {
      setError("パーツ名を入力してください");
      return;
    }
    if (form.cost !== "" && Number(form.cost) < 0) {
      setError("費用は0以上で入力してください");
      return;
    }
    setError("");
    if (editingId) {
      setRecords(records.map((r) => (r.id === editingId ? { ...r, ...form } : r)));
    } else {
      setRecords([{ id: uid(), ...form }, ...records]);
    }
    setForm(blankForm);
    setEditingId(null);
    setShowForm(false);
  };

  const remove = (id) => {
    if (!window.confirm("このカスタム記録を削除しますか？")) return;
    setRecords(records.filter((r) => r.id !== id));
  };

  const sorted = [...records].sort((a, b) => (a.date < b.date ? 1 : -1));
  const grouped = CUSTOM_CATEGORIES.map((cat) => ({
    cat,
    items: sorted.filter((r) => r.category === cat),

  const activeRecords = records.filter((r) => (r.status || "active") === "active");

    <div>
      <div
        style={{
          display: "flex",
          alignItems: "center",
          justifyContent: "space-between",

            <div

                fontSize: 12,
                color: COLORS.amber,

            borderRadius: 7,
            padding: "9px 14px",
            fontSize: 13,
            fontWeight: 700,
            display: "flex",
            alignItems: "center",
            gap: 5,
            cursor: "pointer",
          }}
        >
          <Plus size={15} />
          カスタムを追加
        </button>
      </div>

      {showForm && (
        <div
          style={{
            background: COLORS.surface,
            border: `1px solid ${COLORS.border}`,
            borderRadius: 10,
            padding: 14,
            marginBottom: 16,
          }}
        >
          {editingId && (
            <div
              style={{
                fontSize: 12,
                color: COLORS.amber,
                marginBottom: 10,
                fontWeight: 600,
              }}
            >
              カスタム記録を編集中
            </div>

          <div style={{ display: "flex", gap: 10 }}>
            <div style={{ flex: 1 }}>
              <Field label="装着日">
                <input
                  type="date"
                  value={form.date}
                  onChange={(e) => setForm({ ...form, date: e.target.value })}
                  style={inputStyle}
                />
              </Field>
            </div>
            <div style={{ flex: 1 }}>
              <Field label="カテゴリー">
                <select
                  value={form.category}
                  onChange={(e) => setForm({ ...form, category: e.target.value })}
                  style={inputStyle}
                >
                  {CUSTOM_CATEGORIES.map((c) => (
                    <option key={c} value={c}>
                      {c}
                    </option>
                  ))}
                </select>
              </Field>
            </div>
          </div>

          <Field label="パーツ名">
            <input
              value={form.part}
              onChange={(e) => {
                setForm({ ...form, part: e.target.value });
                if (error) setError("");
              }}
              style={inputStyle}
              placeholder="例: BLITZ 車高調"
            />
            {error && (
              <div style={{ color: "#e08585", fontSize: 12, marginTop: 6 }}>

          <div style={{ display: "flex", gap: 10 }}>

            <div style={{ flex: 1 }}>

              </Field>
            </div>
          </div>

          <Field label="メモ">
            <input

          <Field label="現在の状態">

function MyRoadsterTab({ mileage, maintRecords, customRecords, oilRemain }) {
  const [history, setHistory] = useState(null);
  const activeCustom = customRecords
    .filter((r) => (r.status || "active") === "active")
    .sort((a, b) => (a.date < b.date ? 1 : -1));

  const maintEntries = [];
  maintRecords.forEach((record) => {
    const recordItems = record.items || (record.categories || [record.category])
      .filter(Boolean).map((category) => ({ category, details: {} }));
    recordItems.forEach((item) => maintEntries.push({
      type: "maint",
      category: item.category,
      date: record.date || "",
      mileage: record.mileage || "",
      cost: record.cost || "",
      memo: record.memo || "",
      details: item.details || {},
    }));
  });
  maintEntries.sort((a, b) => (a.date < b.date ? 1 : -1));
  const latestMaint = [];
  const seenCategories = new Set();
  maintEntries.forEach((entry) => {
    if (!seenCategories.has(entry.category)) {
      seenCategories.add(entry.category);
      latestMaint.push(entry);
    }
  });

  const historyFor = (kind, category) => {
    if (kind === "custom") {
      return customRecords.filter((r) => r.category === category).sort((a, b) => (a.date < b.date ? 1 : -1));
    }
    return maintEntries.filter((r) => r.category === category);
  };

  const openHistory = (kind, category, title) => setHistory({
    title,
    entries: historyFor(kind, category),
  });

  const detailLines = (details) => Object.entries(details || {}).filter(([, value]) => value);

  return (
    <div>
      <div style={{ marginBottom: 14 }}>
        <div style={{ fontSize: 11, letterSpacing: 2.2, color: COLORS.textMuted }}>MY ROADSTER</div>
        <div style={{ fontSize: 22, fontWeight: 800, marginTop: 3 }}>現在仕様</div>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginBottom: 16 }}>
        <MiniStat label="総走行距離" value={`${Number(mileage || 0).toLocaleString()}km`} />
        <MiniStat label="次回オイルまで" value={oilRemain === null ? "-" : `${Number(oilRemain).toLocaleString()}km`} warn={oilRemain !== null && oilRemain <= 500} />
        <MiniStat label="装着カスタム" value={`${activeCustom.length}点`} />
        <MiniStat label="最新整備項目" value={`${latestMaint.length}項目`} />
      </div>

      <div style={{ fontSize: 12, fontWeight: 700, color: COLORS.amber, marginBottom: 7 }}>CURRENT CUSTOM</div>
      {activeCustom.length === 0 && <EmptyState text="現在装着中のカスタムはありません" />}
      {activeCustom.map((r) => (
        <button key={r.id} onClick={() => openHistory("custom", r.category, r.category)} style={{ width: "100%", textAlign: "left", background: COLORS.surface, border: `1px solid ${COLORS.border}`, borderRadius: 10, padding: 12, marginBottom: 8, color: COLORS.text, cursor: "pointer" }}>
          <div style={{ display: "flex", justifyContent: "space-between", gap: 8 }}>
            <div>
              <div style={{ fontSize: 10, color: COLORS.textMuted }}>{r.category}</div>
              <div style={{ fontSize: 14, fontWeight: 700, marginTop: 2 }}>{r.brand ? `${r.brand} ${r.part}` : r.part}</div>
              {r.memo && <div style={{ fontSize: 11, color: COLORS.textMuted, marginTop: 4 }}>{r.memo}</div>}
            </div>
            <ChevronRight size={16} color={COLORS.textMuted} />
          </div>
        </button>
      ))}

      <div style={{ fontSize: 12, fontWeight: 700, color: COLORS.amber, margin: "18px 0 7px" }}>LATEST MAINTENANCE</div>
      {latestMaint.length === 0 && <EmptyState text="整備記録はまだありません" />}
      {latestMaint.map((entry) => (
        <button key={entry.category} onClick={() => openHistory("maint", entry.category, entry.category)} style={{ width: "100%", textAlign: "left", background: COLORS.surface, border: `1px solid ${COLORS.border}`, borderRadius: 10, padding: 12, marginBottom: 8, color: COLORS.text, cursor: "pointer" }}>
          <div style={{ display: "flex", justifyContent: "space-between", gap: 8 }}>
            <div style={{ minWidth: 0 }}>
              <div style={{ fontSize: 14, fontWeight: 700 }}>{entry.category}</div>
              <div style={{ fontSize: 10, color: COLORS.textMuted, marginTop: 3 }}>{fmtDate(entry.date)}{entry.mileage && ` · ${Number(entry.mileage).toLocaleString()}km`}</div>
              {detailLines(entry.details).map(([key, value]) => (
                <div key={key} style={{ fontSize: 11, color: COLORS.textMuted, marginTop: 3 }}>{maintFieldLabel(entry.category, key)}: {value}</div>
              ))}
            </div>
            <ChevronRight size={16} color={COLORS.textMuted} />
          </div>
        </button>
      ))}

      <div style={{ fontSize: 10, lineHeight: 1.6, color: COLORS.textMuted, marginTop: 12 }}>
        カスタムの「現在の状態」を変更すると、このページへ自動反映されます。各カードをタップすると履歴を確認できます。
      </div>

      {history && (
        <div onClick={() => setHistory(null)} style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.65)", display: "flex", alignItems: "flex-end", justifyContent: "center", zIndex: 110 }}>
          <div onClick={(e) => e.stopPropagation()} style={{ width: "100%", maxWidth: 480, maxHeight: "72vh", overflowY: "auto", background: COLORS.surface, border: `1px solid ${COLORS.border}`, borderBottom: "none", borderTopLeftRadius: 16, borderTopRightRadius: 16, padding: "16px 16px 28px" }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
              <div><div style={{ fontSize: 10, color: COLORS.textMuted }}>HISTORY</div><div style={{ fontSize: 18, fontWeight: 800 }}>{history.title}</div></div>
              <button onClick={() => setHistory(null)} style={{ background: "transparent", border: "none", color: COLORS.textMuted, padding: 6 }}><X size={20} /></button>
            </div>
            {history.entries.map((entry, index) => (
              <div key={(entry.id || entry.date || "entry") + index} style={{ borderLeft: `2px solid ${index === 0 ? COLORS.red : COLORS.border}`, padding: "2px 0 12px 12px", marginLeft: 5 }}>
                <div style={{ fontSize: 11, color: index === 0 ? COLORS.amber : COLORS.textMuted }}>{index === 0 ? "最新 · " : ""}{fmtDate(entry.date)}</div>
                <div style={{ fontSize: 13, fontWeight: 700, marginTop: 2 }}>{entry.part || entry.category}</div>
                {entry.brand && <div style={{ fontSize: 11, color: COLORS.textMuted }}>{entry.brand}</div>}
                {detailLines(entry.details).map(([key, value]) => <div key={key} style={{ fontSize: 11, color: COLORS.textMuted }}>{maintFieldLabel(entry.category, key)}: {value}</div>)}
                {entry.memo && <div style={{ fontSize: 11, color: COLORS.textMuted, marginTop: 3 }}>{entry.memo}</div>}
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

function MainApp() {
  const [tab, setTab] = useState("maint");
  const [loaded, setLoaded] = useState(false);
  const [mileage, setMileage] = useState(0);
  const [maintRecords, setMaintRecords] = useState([]);
  const [circuitRecords, setCircuitRecords] = useState([]);
  const [customRecords, setCustomRecords] = useState([]);
  const [oilInterval, setOilInterval] = useState(5000);
  const [syncStatus, setSyncStatus] = useState("同期確認中");
  const [showModPopup, setShowModPopup] = useState(false);
  const [showSettings, setShowSettings] = useState(false);
  const [highlightModId, setHighlightModId] = useState(null);

  useEffect(() => {
    const handleStatus = (event) => setSyncStatus(event.detail || "端末保存のみ");
    window.addEventListener("nd-sync-status", handleStatus);
    return () => window.removeEventListener("nd-sync-status", handleStatus);
  }, []);

  useEffect(() => {
    let cancelled = false;

    (async () => {
      const data = await loadAppData();
      if (cancelled) return;

      const loadedMaintRecords = data["nd-maint-records"] || [];
      const highestRecordedMileage = loadedMaintRecords.reduce(
        (max, record) => Math.max(max, Number(record.mileage) || 0),
        0
      );
      setMileage(Math.max(Number(data["nd-mileage"]) || 0, highestRecordedMileage));
      setMaintRecords(loadedMaintRecords);
      setCircuitRecords(data["nd-circuit-records"] || []);
      setCustomRecords(data["nd-custom-records"] || []);
      setOilInterval(Number(data["nd-oil-interval"]) || 5000);
      setLoaded(true);
    })();

    return () => { cancelled = true; };
  }, []);

  useEffect(() => {
    if (!loaded) return;
    saveAppValue("nd-mileage", mileage);
  }, [mileage, loaded]);

  useEffect(() => {
    if (!loaded) return;
    saveAppValue("nd-maint-records", maintRecords);
  }, [maintRecords, loaded]);

  useEffect(() => {
    if (!loaded) return;
    const highestRecordedMileage = maintRecords.reduce(
      (max, record) => Math.max(max, Number(record.mileage) || 0),
      0
    );
    if (highestRecordedMileage > mileage) {
      setMileage(highestRecordedMileage);
    }
  }, [maintRecords, mileage, loaded]);

  useEffect(() => {
    if (!loaded) return;
    saveAppValue("nd-circuit-records", circuitRecords);
  }, [circuitRecords, loaded]);

  useEffect(() => {
    if (!loaded) return;
    saveAppValue("nd-custom-records", customRecords);
  }, [customRecords, loaded]);

  useEffect(() => {
    if (!loaded) return;
    saveAppValue("nd-oil-interval", oilInterval);
  }, [oilInterval, loaded]);

  const hasOilChange = (r) => {
    if (r.items) return r.items.some((it) => it.category === "エンジンオイル交換");
    if (r.categories) return r.categories.includes("エンジンオイル交換");
    return r.category === "エンジンオイル交換";
  };
  const lastOil = maintRecords
    .filter(hasOilChange)
    .sort((a, b) => (Number(b.mileage) || 0) - (Number(a.mileage) || 0))[0];
  const oilDueAt = lastOil ? (Number(lastOil.mileage) || 0) + oilInterval : null;
  const oilRemain = oilDueAt !== null ? oilDueAt - mileage : null;

  const totalCost = maintRecords.reduce((s, r) => s + (Number(r.cost) || 0), 0);
  const trackDays = circuitRecords.length;

  const exportBackup = () => {
    const backup = {
      app: "Roadster Log",
      exportedAt: new Date().toISOString(),
      data: {
        "nd-mileage": mileage,
        "nd-maint-records": maintRecords,
        "nd-circuit-records": circuitRecords,
        "nd-custom-records": customRecords,
        "nd-oil-interval": oilInterval,
      },
    };
    const blob = new Blob([JSON.stringify(backup, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = `Roadster_Log_Backup_${new Date().toISOString().slice(0, 10)}.json`;
    link.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  };

  const importBackup = async (event) => {
    const file = event.target.files && event.target.files[0];
    event.target.value = "";
    if (!file) return;
    try {
      const parsed = JSON.parse(await file.text());
      const data = parsed.data || parsed;
      const maint = data["nd-maint-records"];
      const circuit = data["nd-circuit-records"];
      const custom = data["nd-custom-records"];
      if (!Array.isArray(maint) || !Array.isArray(circuit) || !Array.isArray(custom)) {
        throw new Error("Roadster Logのバックアップ形式ではありません");
      }
      if (!window.confirm("現在のデータをバックアップ内容で置き換えますか？")) return;
      setMileage(Number(data["nd-mileage"]) || 0);
      setMaintRecords(maint);
      setCircuitRecords(circuit);
      setCustomRecords(custom);
      setOilInterval(Number(data["nd-oil-interval"]) || 5000);
      window.alert("バックアップを復元しました");
    } catch (err) {
      window.alert("復元できませんでした：" + (err.message || err));
    }
  };

  return (
    <div
      style={{
        background: COLORS.bg,
        color: COLORS.text,
        minHeight: "100vh",
        fontFamily:
          "'Hiragino Sans', 'Yu Gothic', system-ui, -apple-system, sans-serif",
        paddingBottom: 40,
      }}

/* ---- storage helpers (GitHub Pages + GAS backend) ----
   画面は静的ホスティング、GASはGoogle Driveへの同期APIとして使用。
   端末側にもlocalStorageバックアップを保持します。
*/
const STORAGE_KEYS = [
  "nd-mileage",
  "nd-maint-records",
  "nd-circuit-records",
  "nd-custom-records",
  "nd-oil-interval",
];
const API_URL_KEY = "nd-gas-api-url";
const SYNC_KEY_KEY = "nd-gas-sync-key";
const LOCAL_META_KEY = "nd-sync-updated-at";
let pendingSyncCount = 0;
let syncHadError = false;

function emitSyncStatus(status) {
  window.dispatchEvent(new CustomEvent("nd-sync-status", { detail: status }));
}

function getLocalMeta() {
  return loadJSON(LOCAL_META_KEY, {});
}

function setLocalUpdatedAt(key, updatedAt) {
  const meta = getLocalMeta();
  meta[key] = Number(updatedAt) || Date.now();
  saveJSON(LOCAL_META_KEY, meta);
}

function loadJSON(key, fallback) {
  try {
    const v = localStorage.getItem(key);
    return v ? JSON.parse(v) : fallback;
  } catch (e) {
    return fallback;
  }
}

function saveJSON(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
}

function getLocalSnapshot() {
  return {
    "nd-mileage": Number(localStorage.getItem("nd-mileage")) || 0,
    "nd-maint-records": loadJSON("nd-maint-records", []),
    "nd-circuit-records": loadJSON("nd-circuit-records", []),
    "nd-custom-records": loadJSON("nd-custom-records", []),
    "nd-oil-interval": Number(localStorage.getItem("nd-oil-interval")) || 5000,
  };
}

function getApiConfig() {
  return {
    url: (localStorage.getItem(API_URL_KEY) || "").trim(),
    key: (localStorage.getItem(SYNC_KEY_KEY) || "").trim(),
  };
}

function normalizeGasUrl(url) {
  url = String(url || "").trim();
  if (!url) return "";
  // /dev ではなく公開用 /exec を使う。
  return url.replace(/\/dev(?:\?.*)?$/, "/exec");
}

function ensureApiConfig() {
  let cfg = getApiConfig();
  if (cfg.url && cfg.key) return cfg;

  const url = window.prompt(
    "Roadster Logの同期設定\\n\\nApps ScriptのウェブアプリURL（/execで終わるURL）を貼り付けてください。\\nあとでキャンセルして端末保存だけで使うこともできます。",
    cfg.url || ""
  );
  if (!url) return cfg;

  const key = window.prompt(
    "Code.gsに設定したSYNC_KEYを入力してください。",
    cfg.key || ""
  );
  if (!key) return cfg;

  cfg = { url: normalizeGasUrl(url), key: key.trim() };
  localStorage.setItem(API_URL_KEY, cfg.url);
  localStorage.setItem(SYNC_KEY_KEY, cfg.key);
  return cfg;
}

// 設定をやり直したい時にSafariのアドレス末尾へ ?sync=reset を付けて開く。
(function handleSyncReset() {
  try {
    const q = new URLSearchParams(location.search);
    if (q.get("sync") === "reset") {
      localStorage.removeItem(API_URL_KEY);
      localStorage.removeItem(SYNC_KEY_KEY);
    }
  } catch (e) {}
})();

function jsonpLoad(url, syncKey) {
  return new Promise((resolve, reject) => {
    const cb = "__ndJsonp_" + Date.now() + "_" + Math.random().toString(36).slice(2);
    const script = document.createElement("script");
    const timer = setTimeout(() => cleanup(new Error("同期読込がタイムアウトしました")), 12000);

    function cleanup(err, value) {
      clearTimeout(timer);
      try { delete window[cb]; } catch (e) { window[cb] = undefined; }
      if (script.parentNode) script.parentNode.removeChild(script);
      err ? reject(err) : resolve(value);
    }

    window[cb] = (result) => cleanup(null, result);
    script.onerror = () => cleanup(new Error("同期サーバーへ接続できませんでした"));
    script.src = url + (url.includes("?") ? "&" : "?") +
      "action=load&callback=" + encodeURIComponent(cb) +
      "&syncKey=" + encodeURIComponent(syncKey) +
      "&_=" + Date.now();
    document.head.appendChild(script);
  });
}

function postToGas(params) {
  const cfg = getApiConfig();
  if (!cfg.url || !cfg.key) return Promise.reject(new Error("同期設定がありません"));

  return new Promise((resolve, reject) => {
    const targetName = "nd-sync-" + Date.now() + "-" + Math.random().toString(36).slice(2);
    const iframe = document.createElement("iframe");
    const form = document.createElement("form");
    let submitted = false;
    let submittedAt = 0;
    const timeoutMs = params.action === "analyzePhoto" ? 90000 : 15000;
    const timer = setTimeout(() => cleanup(new Error(params.action === "analyzePhoto" ? "AI読取がタイムアウトしました" : "同期送信がタイムアウトしました")), timeoutMs);

    function cleanup(err) {
      clearTimeout(timer);
      setTimeout(() => {
        form.remove();
        iframe.remove();
      }, 100);
      err ? reject(err) : resolve();
    }

    iframe.name = targetName;
    iframe.style.display = "none";
    iframe.onload = () => {
      if (submitted && Date.now() - submittedAt > 200) cleanup();
    };
    document.body.appendChild(iframe);

    form.method = "POST";
    form.action = cfg.url;
    form.target = targetName;
    form.style.display = "none";

    const payload = { ...params, syncKey: cfg.key };
    Object.entries(payload).forEach(([k, v]) => {
      const input = document.createElement("input");
      input.type = "hidden";
      input.name = k;
      input.value = typeof v === "string" ? v : JSON.stringify(v);
      form.appendChild(input);
    });

    document.body.appendChild(form);
    submitted = true;
    submittedAt = Date.now();
    form.submit();
  });
}

function jsonpRequest(url, params) {
  return new Promise((resolve, reject) => {
    const cb = "__ndReq_" + Date.now() + "_" + Math.random().toString(36).slice(2);
    const script = document.createElement("script");
    const timer = setTimeout(() => cleanup(new Error("AI読取の確認がタイムアウトしました")), 15000);
    function cleanup(err, value) {
      clearTimeout(timer);
      try { delete window[cb]; } catch (e) { window[cb] = undefined; }
      if (script.parentNode) script.parentNode.removeChild(script);
      err ? reject(err) : resolve(value);
    }
    window[cb] = (result) => cleanup(null, result);
    script.onerror = () => cleanup(new Error("同期サーバーへ接続できませんでした"));
    const query = new URLSearchParams({ ...params, callback: cb, _: String(Date.now()) });
    script.src = url + (url.includes("?") ? "&" : "?") + query.toString();
    document.head.appendChild(script);
  });
}

function preparePhotoForAi(file) {
  return new Promise((resolve, reject) => {
    if (!file.type.startsWith("image/")) return reject(new Error("画像ファイルを選んでください"));
    const img = new Image();
    const objectUrl = URL.createObjectURL(file);
    img.onload = () => {
      try {
        const maxSide = 1600;
        const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
        const canvas = document.createElement("canvas");
        canvas.width = Math.max(1, Math.round(img.width * scale));
        canvas.height = Math.max(1, Math.round(img.height * scale));
        canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
        const dataUrl = canvas.toDataURL("image/jpeg", 0.78);
        resolve({ mimeType: "image/jpeg", data: dataUrl.split(",")[1] });
      } catch (err) { reject(err); }
      finally { URL.revokeObjectURL(objectUrl); }
    };
    img.onerror = () => { URL.revokeObjectURL(objectUrl); reject(new Error("画像を開けませんでした")); };
    img.src = objectUrl;
  });
}

async function analyzeMaintenancePhoto(imageData, mimeType) {
  const cfg = getApiConfig();
  if (!cfg.url || !cfg.key) throw new Error("先に同期設定が必要です");
  const requestId = "photo_" + Date.now() + "_" + Math.random().toString(36).slice(2);
  await postToGas({ action: "analyzePhoto", requestId, imageData, mimeType });
  const startedAt = Date.now();
  while (Date.now() - startedAt < 90000) {
    await new Promise((resolve) => setTimeout(resolve, 1600));
    const result = await jsonpRequest(cfg.url, { action: "analysisResult", requestId, syncKey: cfg.key });
    if (result && result.status === "done") return result.result;
    if (result && result.status === "error") throw new Error(result.error || "AI読取に失敗しました");
  }
  throw new Error("AI読取がタイムアウトしました");
}

function hasMeaningfulData(data) {
  return STORAGE_KEYS.some((key) => {
    const value = data && data[key];
    return Array.isArray(value) ? value.length > 0 : Number(value) > 0;
  });
}

function copyToLocal(data) {
  STORAGE_KEYS.forEach((key) => {
    if (!(key in data)) return;
    if (key === "nd-mileage" || key === "nd-oil-interval") {
      try { localStorage.setItem(key, String(data[key] || 0)); } catch (e) {}
    } else {
      saveJSON(key, data[key]);
    }
  });
}

async function loadAppData() {
  const local = getLocalSnapshot();
  const cfg = ensureApiConfig();
  if (!cfg.url || !cfg.key) {
    emitSyncStatus("端末保存のみ");
    return local;
  }

  try {
    emitSyncStatus("同期確認中");
    const result = await jsonpLoad(cfg.url, cfg.key);
    if (!result || !result.ok) {
      console.warn("Drive同期を開始できませんでした:", result && result.error);
      emitSyncStatus("同期失敗");
      return local;
    }

    const serverData = result.data || {};
    const serverMeta = serverData._updatedAt || {};
    const localMeta = getLocalMeta();
    const merged = {};

    STORAGE_KEYS.forEach((key) => {
      const localTime = Number(localMeta[key]) || 0;
      const serverTime = Number(serverMeta[key]) || 0;
      const serverHasValue = Object.prototype.hasOwnProperty.call(serverData, key);

      if (localTime > serverTime || (!serverHasValue && localTime > 0)) {
        merged[key] = local[key];
        postToGas({
          action: "saveValue",
          key,
          value: JSON.stringify(local[key]),
          updatedAt: String(localTime),
        }).catch(() => {});
      } else if (serverHasValue) {
        merged[key] = serverData[key];
        if (serverTime) setLocalUpdatedAt(key, serverTime);
      } else {
        const now = Date.now();
        merged[key] = local[key];
        setLocalUpdatedAt(key, now);
        postToGas({
          action: "saveValue",
          key,
          value: JSON.stringify(local[key]),
          updatedAt: String(now),
        }).catch(() => {});
      }
    });

    copyToLocal(merged);
    emitSyncStatus("同期済み");
    return merged;
  } catch (err) {
    console.warn("Drive読込に失敗。端末バックアップを使用します。", err);
    emitSyncStatus("同期失敗");
    return local;
  }
}

function saveAppValue(key, value) {
  // 端末側には即保存。
  if (key === "nd-mileage" || key === "nd-oil-interval") {
    try { localStorage.setItem(key, String(value || 0)); } catch (e) {}
  } else {
    saveJSON(key, value);
  }

  const updatedAt = Date.now();
  setLocalUpdatedAt(key, updatedAt);

  const cfg = getApiConfig();
  if (!cfg.url || !cfg.key) {
    emitSyncStatus("端末保存のみ");
    return;
  }

  pendingSyncCount += 1;
  emitSyncStatus("同期中");
  postToGas({
    action: "saveValue",
    key,
    value: JSON.stringify(value),
    updatedAt: String(updatedAt),
  })
    .then(() => jsonpLoad(cfg.url, cfg.key))
    .then((result) => {
      const savedValue = result && result.ok && result.data && result.data[key];
      if (JSON.stringify(savedValue) !== JSON.stringify(value)) {
        throw new Error("保存内容を確認できませんでした");
      }
    })
    .catch((err) => {
      console.warn("Drive同期に失敗しました", err);
      syncHadError = true;
    })
    .finally(() => {
      pendingSyncCount = Math.max(0, pendingSyncCount - 1);
      if (pendingSyncCount === 0) {
        emitSyncStatus(syncHadError ? "同期失敗" : "同期済み");
        syncHadError = false;
      }
    });
}

              objectFit: isNarrowPortrait ? "contain" : "cover",
              objectPosition: isNarrowPortrait ? "center center" : "center 40%",
              animation: isNarrowPortrait
                ? "nd-fade-in 1s ease"
                : "nd-photo-in 1.4s cubic-bezier(.2,.8,.2,1)",
              filter: "brightness(0.92)",
            }}
          />
        </div>

        <div
          style={{
            textAlign: "center",
            padding: "8px 20px 0",
          }}
        >
          <div
            style={{
              fontSize: 24,
              fontWeight: 700,
              color: COLORS.text,
              letterSpacing: 2,
              textShadow: "0 2px 10px rgba(0,0,0,0.5)",
            }}
          >
            MX-5 ND
          </div>
          <div
            style={{
              fontSize: 12,
              color: COLORS.textMuted,
              letterSpacing: 3,
              marginTop: 4,
              textTransform: "uppercase",
            }}
          >
            Roadster Log
          </div>
          <div
            style={{
              width: 6,
              height: 6,
              borderRadius: "50%",
              background: COLORS.red,
              margin: "18px auto 0",
              animation: "nd-pulse 1.2s ease-in-out infinite",
            }}
          />
        </div>
      </div>
    </div>
  );
}

function App() {
  const [booted, setBooted] = useState(false);
  if (!booted) return <Splash onDone={() => setBooted(true)} />;
  return <MainApp />;
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);

</script>
</body>
</html>
