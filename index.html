<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;
const SPLASH_PHOTO = window.SPLASH_PHOTO;

  text: "#f2f0ec",

  green: "#5a9b6e",

const MAINT_CATEGORIES = [
  "エンジンオイル交換",
  "オイルフィルター交換",

  "その他",
];

const CUSTOM_CATEGORIES = [
  "足回り(サスペンション)",
  "エンジン/吸排気",
  "ブレーキ",
  "ホイール/タイヤ",
  "外装/エアロ",
  "内装",
  "電装/オーディオ",
  "その他",
];

const MAINT_FIELD_DEFS = {
  "エンジンオイル交換": [
    { key: "oilType", label: "オイルの種類", placeholder: "例: 5W-30 化学合成油" },
    { key: "amount", label: "交換量", placeholder: "例: 3.2L" },
  ],
  "オイルフィルター交換": [
    { key: "partNumber", label: "品番", placeholder: "任意" },
  ],
  "タイヤ交換": [
    { key: "pressure", label: "空気圧 (kPa)", placeholder: "220" },
    { key: "rotation", label: "ローテーション", placeholder: "例: あり / なし" },
    { key: "brand", label: "タイヤ銘柄", placeholder: "任意" },
  ],
  "ブレーキパッド交換": [
    { key: "position", label: "位置", placeholder: "例: 前後 / 前のみ / 後のみ" },
    { key: "brand", label: "パッド銘柄", placeholder: "任意" },
  ],
  "ブレーキフルード交換": [
    { key: "fluidType", label: "フルード規格", placeholder: "例: DOT4" },
  ],
  "冷却水交換": [
    { key: "coolantType", label: "クーラント種類", placeholder: "任意" },
  ],
  "バッテリー交換": [
    { key: "battery", label: "バッテリー型番", placeholder: "任意" },
  ],
  "車検": [
    { key: "shop", label: "実施店舗", placeholder: "任意" },
  ],
  "その他": [],
};

function maintFieldLabel(category, key) {
  const defs = MAINT_FIELD_DEFS[category] || [];
  const f = defs.find((d) => d.key === key);
  return f ? f.label : key;
}

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

function fmtDate(d) {
  if (!d) return "";
  const dt = new Date(d);
  return `${dt.getFullYear()}/${dt.getMonth() + 1}/${dt.getDate()}`;
}

function yearOf(d) {
  if (!d) return null;
  return new Date(d).getFullYear();
}

function YearFilter({ years, selected, setSelected }) {
  if (years.length === 0) return null;
  return (
    <div
      style={{
        display: "flex",
        gap: 6,
        overflowX: "auto",
        marginBottom: 14,
        paddingBottom: 2,
      }}
    >
      <YearChip label="すべて" active={selected === "all"} onClick={() => setSelected("all")} />
      {years.map((y) => (
        <YearChip
          key={y}
          label={`${y}年`}
          active={selected === y}
          onClick={() => setSelected(y)}
        />
      ))}
    </div>
  );
}

function YearChip({ label, active, onClick }) {
  return (
    <button
      onClick={onClick}
      style={{
        flexShrink: 0,
        fontSize: 12.5,
        fontWeight: 600,
        padding: "6px 12px",
        borderRadius: 999,
        border: `1px solid ${active ? COLORS.red : COLORS.border}`,
        background: active ? COLORS.redDim : "transparent",
        color: active ? "#fff" : COLORS.textMuted,
        cursor: "pointer",
      }}
    >
      {label}
    </button>
  );
}

function Header({ mileage, setMileage }) {
  const [editing, setEditing] = useState(false);
  const [draft, setDraft] = useState(mileage);

  return (
    <div
      style={{
        borderBottom: `1px solid ${COLORS.border}`,
        padding: "20px 16px 16px",
        paddingTop: "calc(env(safe-area-inset-top, 0px) + 20px)",
        background: `linear-gradient(180deg, ${COLORS.surface}, ${COLORS.bg})`,
      }}
    >
      <div
        style={{
          display: "flex",
          alignItems: "center",
          gap: 8,
          marginBottom: 4,
        }}
      >
        <div
          style={{
            width: 6,
            height: 6,
            borderRadius: "50%",
            background: COLORS.red,
          }}
        />
        <span
          style={{
            fontSize: 12,
            letterSpacing: 2,
            color: COLORS.textMuted,
            textTransform: "uppercase",
          }}
        >
          MX-5 ND / My Roadster Log
        </span>
      </div>
      <h1 style={{ fontSize: 22, fontWeight: 700, margin: "2px 0 14px" }}>
        整備・サーキット記録
      </h1>

      <div
        style={{
          background: COLORS.surfaceRaised,
          border: `1px solid ${COLORS.border}`,
          borderRadius: 10,
          padding: "12px 14px",
          display: "flex",
          alignItems: "center",
          justifyContent: "space-between",
        }}
      >
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <Gauge size={18} color={COLORS.amber} />
          <span style={{ fontSize: 12, color: COLORS.textMuted }}>総走行距離</span>
        </div>
        {editing ? (
          <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
            <input
              type="number"
              value={draft}
              onChange={(e) => setDraft(e.target.value)}
              style={{
                width: 90,
                background: COLORS.bg,
                border: `1px solid ${COLORS.border}`,
                borderRadius: 6,
                color: COLORS.text,
                padding: "4px 8px",
                fontFamily: "monospace",
                fontSize: 16,
              }}
              autoFocus
            />
            <button
              onClick={() => {
                setMileage(Number(draft) || 0);
                setEditing(false);
              }}
              style={{
                background: COLORS.red,
                border: "none",
                color: "#fff",
                borderRadius: 6,
                padding: "5px 10px",
                fontSize: 13,
              }}
            >
              保存
            </button>
          </div>
        ) : (
          <div
            onClick={() => {
              setDraft(mileage);
              setEditing(true);
            }}
            style={{
              fontFamily: "monospace",
              fontSize: 22,
              fontWeight: 700,
              letterSpacing: 1,
              cursor: "pointer",
            }}
          >
            {mileage.toLocaleString()}
            <span style={{ fontSize: 12, color: COLORS.textMuted, marginLeft: 4 }}>
              km
            </span>
          </div>
        )}
      </div>
    </div>
  );
}

function SummaryStrip({ oilRemain, totalCost, trackDays, modCount, onModClick }) {
  return (
    <div
      style={{
        display: "grid",
        gridTemplateColumns: "1fr 1fr",

        margin: "16px 0",

      <MiniStat
        label="次回オイルまで"
        value={oilRemain === null ? "-" : `${oilRemain.toLocaleString()}km`}

      />
      <MiniStat label="整備累計費用" value={`¥${totalCost.toLocaleString()}`} />

}

const inputStyle = {
  width: "100%",
  boxSizing: "border-box",

function MaintTab({ records, setRecords, mileage }) {
  const blankMeta = {
    date: new Date().toISOString().slice(0, 10),
    mileage: mileage || "",
    cost: "",
    memo: "",
  };
  const [meta, setMeta] = useState(blankMeta);
  const [items, setItems] = useState([]);
  const [currentCategory, setCurrentCategory] = useState("");
  const [currentDetails, setCurrentDetails] = useState({});
  const [currentCustomName, setCurrentCustomName] = useState("");
  const [error, setError] = useState("");
  const [showForm, setShowForm] = useState(false);
  const [selectedYear, setSelectedYear] = useState("all");

  const resetAll = () => {
    setMeta({ ...blankMeta, mileage: mileage || "" });
    setItems([]);
    setCurrentCategory("");
    setCurrentDetails({});
    setCurrentCustomName("");
    setError("");
  };

  const pickCategory = (c) => {
    setCurrentCategory(c);
    setCurrentDetails({});
    setCurrentCustomName("");
    setError("");
  };

  const addItem = () => {
    if (!currentCategory) return;
    if (currentCategory === "その他" && !currentCustomName.trim()) {
      setError("項目名を入力してください");
      return;
    }
    const label = currentCategory === "その他" ? currentCustomName.trim() : currentCategory;
    setItems([...items, { category: label, details: currentDetails }]);
    setCurrentCategory("");
    setCurrentDetails({});
    setCurrentCustomName("");
    setError("");
  };

  const removeItem = (idx) => setItems(items.filter((_, i) => i !== idx));

  const save = () => {
    if (items.length === 0) {
      setError("項目を1つ以上追加してください");
      return;
    }
    setError("");
    setRecords([{ id: uid(), ...meta, items }, ...records]);
    resetAll();
    setShowForm(false);
  };

  const remove = (id) => setRecords(records.filter((r) => r.id !== id));

  const sorted = [...records].sort((a, b) => (a.date < b.date ? 1 : -1));
  const years = Array.from(new Set(records.map((r) => yearOf(r.date)).filter(Boolean))).sort(
    (a, b) => b - a
  );
  const filtered =
    selectedYear === "all" ? sorted : sorted.filter((r) => yearOf(r.date) === selectedYear);

  const currentFieldDefs = MAINT_FIELD_DEFS[currentCategory] || [];

  return (
    <div>
      <div
        style={{
          display: "flex",
          alignItems: "center",
          justifyContent: "space-between",
          marginBottom: 14,
        }}
      >
        <div style={{ fontSize: 20, fontWeight: 700 }}>
          {records.length}
          <span style={{ fontSize: 12, color: COLORS.textMuted, marginLeft: 4 }}>
            件の記録
          </span>
        </div>
        <button
          onClick={() => {
            if (showForm) {
              setShowForm(false);
            } else {
              resetAll();
              setShowForm(true);
            }
          }}
          style={{
            background: showForm ? COLORS.surfaceRaised : COLORS.red,
            border: `1px solid ${showForm ? COLORS.border : COLORS.red}`,
            color: "#fff",
            borderRadius: 7,
            padding: "9px 14px",
            fontSize: 13,
            fontWeight: 700,
            display: "flex",
            alignItems: "center",
            gap: 5,
            cursor: "pointer",
          }}
        >
          <Plus size={15} />
          記録を追加
        </button>
      </div>

      <YearFilter years={years} selected={selectedYear} setSelected={setSelectedYear} />

      {showForm && (
        <div
          style={{
            background: COLORS.surface,
            border: `1px solid ${COLORS.border}`,
            borderRadius: 10,
            padding: 14,
            marginBottom: 16,
          }}
        >
          <div style={{ display: "flex", gap: 10 }}>
            <div style={{ flex: 1 }}>
              <Field label="日付">
                <input
                  type="date"
                  value={meta.date}
                  onChange={(e) => setMeta({ ...meta, date: e.target.value })}
                  style={inputStyle}
                />
              </Field>
            </div>
            <div style={{ flex: 1 }}>
              <Field label="走行距離 (km)">
                <input
                  type="number"
                  value={meta.mileage}
                  onChange={(e) => setMeta({ ...meta, mileage: e.target.value })}
                  style={inputStyle}
                  placeholder="45000"
                />
              </Field>
            </div>
          </div>

          {items.length > 0 && (
            <div style={{ marginBottom: 12 }}>
              <div style={{ fontSize: 11, color: COLORS.textMuted, marginBottom: 6 }}>
                追加した項目
              </div>
              {items.map((it, idx) => (
                <div
                  key={idx}
                  style={{
                    display: "flex",
                    justifyContent: "space-between",
                    alignItems: "flex-start",
                    background: COLORS.surfaceRaised,
                    border: `1px solid ${COLORS.border}`,
                    borderRadius: 7,
                    padding: "8px 10px",
                    marginBottom: 6,
                  }}
                >
                  <div>
                    <div style={{ fontSize: 13, fontWeight: 600 }}>{it.category}</div>
                    {Object.entries(it.details)
                      .filter(([, v]) => v)
                      .map(([k, v]) => (
                        <div key={k} style={{ fontSize: 11, color: COLORS.textMuted }}>
                          {maintFieldLabel(it.category, k)}: {v}
                        </div>
                      ))}
                  </div>
                  <button
                    onClick={() => removeItem(idx)}
                    style={{
                      background: "transparent",
                      border: "none",
                      color: COLORS.textMuted,
                      cursor: "pointer",
                      padding: 2,
                    }}
                    aria-label="削除"
                  >
                    <X size={14} />
                  </button>
                </div>
              ))}
            </div>
          )}

          <Field label={items.length > 0 ? "項目を追加" : "整備項目"}>
            <div
              style={{
                display: "grid",
                gridTemplateColumns: "1fr 1fr",
                gap: 6,
              }}
            >
              {MAINT_CATEGORIES.map((c) => {
                const active = currentCategory === c;
                return (
                  <button
                    type="button"
                    key={c}
                    onClick={() => pickCategory(active ? "" : c)}
                    style={{
                      textAlign: "left",
                      fontSize: 12.5,
                      padding: "8px 9px",
                      borderRadius: 7,
                      border: `1px solid ${active ? COLORS.red : COLORS.border}`,
                      background: active ? COLORS.redDim : COLORS.bg,
                      color: active ? "#fff" : COLORS.text,
                      cursor: "pointer",
                    }}
                  >
                    {c}
                  </button>
                );
              })}
            </div>
          </Field>

          {currentCategory && (
            <div
              style={{
                background: COLORS.bg,
                border: `1px solid ${COLORS.border}`,
                borderRadius: 8,
                padding: 10,
                marginBottom: 12,
              }}
            >
              {currentCategory === "その他" && (
                <Field label="項目名">
                  <input
                    value={currentCustomName}
                    onChange={(e) => setCurrentCustomName(e.target.value)}
                    style={inputStyle}
                    placeholder="例: マフラー交換"
                  />
                </Field>
              )}

              {currentFieldDefs.map((f) => (
                <Field key={f.key} label={f.label}>
                  <input
                    value={currentDetails[f.key] || ""}
                    onChange={(e) =>
                      setCurrentDetails({ ...currentDetails, [f.key]: e.target.value })
                    }
                    style={inputStyle}
                    placeholder={f.placeholder}
                  />
                </Field>
              ))}

              <button
                type="button"
                onClick={addItem}
                style={{
                  width: "100%",
                  background: COLORS.surfaceRaised,
                  border: `1px solid ${COLORS.border}`,
                  color: COLORS.text,
                  borderRadius: 7,
                  padding: "8px 0",
                  fontSize: 13,
                  fontWeight: 700,
                  display: "flex",
                  alignItems: "center",
                  justifyContent: "center",
                  gap: 6,
                  cursor: "pointer",
                }}
              >
                <Plus size={14} />
                この項目を追加
              </button>
            </div>
          )}

          {error && (
            <div style={{ color: "#e08585", fontSize: 12, marginBottom: 10 }}>{error}</div>
          )}

          <Field label="費用 合計(円)">
            <input
              type="number"
              value={meta.cost}
              onChange={(e) => setMeta({ ...meta, cost: e.target.value })}
              style={inputStyle}
              placeholder="8000"
            />
          </Field>

          <Field label="メモ">
            <input
              value={meta.memo}
              onChange={(e) => setMeta({ ...meta, memo: e.target.value })}
              style={inputStyle}
              placeholder="任意"
            />
          </Field>

          <button
            onClick={save}
            style={{
              width: "100%",
              background: COLORS.red,
              border: "none",
              color: "#fff",
              borderRadius: 7,
              padding: "10px 0",
              fontSize: 14,
              fontWeight: 700,
              display: "flex",
              alignItems: "center",
              justifyContent: "center",
              gap: 6,
              cursor: "pointer",
            }}
          >
            <Plus size={16} />
            記録を保存
          </button>
        </div>
      )}

      {filtered.length === 0 && <EmptyState text="整備記録はまだありません" />}

      {filtered.map((r) => (
        <div
          key={r.id}
          style={{
            background: COLORS.surface,
            border: `1px solid ${COLORS.border}`,
            borderRadius: 10,
            padding: 12,
            marginBottom: 8,
          }}
        >
          <div
            style={{
              display: "flex",
              justifyContent: "space-between",
              alignItems: "flex-start",
            }}
          >
            <div style={{ flex: 1 }}>
              {(r.items || (r.categories || [r.category]).filter(Boolean).map((c) => ({ category: c, details: {} }))).map(
                (it, idx) => (
                  <div key={idx} style={{ marginBottom: 4 }}>
                    <span
                      style={{
                        fontSize: 11,
                        fontWeight: 600,
                        padding: "2px 7px",
                        borderRadius: 5,
                        background: COLORS.surfaceRaised,
                        border: `1px solid ${COLORS.border}`,
                      }}
                    >
                      {it.category}
                    </span>
                    {Object.entries(it.details || {})
                      .filter(([, v]) => v)
                      .map(([k, v]) => (
                        <div
                          key={k}
                          style={{ fontSize: 11, color: COLORS.textMuted, marginTop: 2 }}
                        >
                          {maintFieldLabel(it.category, k)}: {v}
                        </div>
                      ))}
                  </div>
                )
              )}
              <div
                style={{
                  fontSize: 12,
                  color: COLORS.textMuted,
                  display: "flex",
                  gap: 10,
                  marginTop: 4,
                }}
              >
                <span>
                  <Calendar
                    size={11}
                    style={{ verticalAlign: -1, marginRight: 3 }}
                  />
                  {fmtDate(r.date)}
                </span>
                {r.mileage && (
                  <span style={{ fontFamily: "monospace" }}>
                    {Number(r.mileage).toLocaleString()}km
                  </span>
                )}
              </div>
              {r.memo && (
                <div style={{ fontSize: 12, color: COLORS.textMuted, marginTop: 4 }}>
                  {r.memo}
                </div>
              )}
            </div>
            <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
              {r.cost && (
                <span
                  style={{
                    fontFamily: "monospace",
                    fontSize: 13,
                    color: COLORS.amber,
                  }}
                >
                  ¥{Number(r.cost).toLocaleString()}
                </span>
              )}
              <button
                onClick={() => remove(r.id)}
                style={{
                  background: "transparent",
                  border: "none",
                  color: COLORS.textMuted,
                  cursor: "pointer",
                  padding: 4,
                }}
                aria-label="削除"
              >
                <Trash2 size={15} />
              </button>
            </div>
          </div>
        </div>
      ))}
    </div>
  );
}

function CircuitTab({ records, setRecords }) {
  const blankForm = {
    date: new Date().toISOString().slice(0, 10),
    circuit: CIRCUITS[0],
    customCircuit: "",
    lapMin: "",
    lapSec: "",
    weather: "晴れ",
    temp: "",
    tireF: "",
    tireR: "",
    memo: "",
  };
  const [form, setForm] = useState(blankForm);
  const [showForm, setShowForm] = useState(false);
  const [selectedYear, setSelectedYear] = useState("all");
  const [viewMode, setViewMode] = useState("date");

  const add = () => {
    if (!form.date) return;
    const circuit =
      form.circuit === "その他" && form.customCircuit
        ? form.customCircuit
        : form.circuit;
    let bestLap = "";
    if (form.lapMin !== "" || form.lapSec !== "") {
      const m = Number(form.lapMin) || 0;
      const s = Number(form.lapSec) || 0;
      bestLap = `${m}:${s.toFixed(3).padStart(6, "0")}`;
    }
    setRecords([{ id: uid(), ...form, circuit, bestLap }, ...records]);
    setForm(blankForm);
    setShowForm(false);
  };

  const remove = (id) => setRecords(records.filter((r) => r.id !== id));
  const sorted = [...records].sort((a, b) => (a.date < b.date ? 1 : -1));
  const years = Array.from(new Set(records.map((r) => yearOf(r.date)).filter(Boolean))).sort(
    (a, b) => b - a
  );
  const filtered =
    selectedYear === "all" ? sorted : sorted.filter((r) => yearOf(r.date) === selectedYear);

  const byCircuit = {};
  filtered.forEach((r) => {
    if (!byCircuit[r.circuit]) byCircuit[r.circuit] = [];
    byCircuit[r.circuit].push(r);
  });
  const circuitGroups = Object.keys(byCircuit)
    .map((name) => ({ name, items: byCircuit[name] }))
    .sort((a, b) => (a.items[0].date < b.items[0].date ? 1 : -1));

  const renderCard = (r) => (
    <div
      key={r.id}
      style={{
        background: COLORS.surface,
        border: `1px solid ${COLORS.border}`,
        borderRadius: 10,
        padding: 12,
        marginBottom: 8,
      }}
    >
      <div
        style={{
          display: "flex",
          justifyContent: "space-between",
          alignItems: "flex-start",
        }}
      >
        <div>
          {viewMode === "date" && (
            <div
              style={{
                fontWeight: 700,
                fontSize: 14,
                marginBottom: 2,
                display: "flex",
                alignItems: "center",
                gap: 5,
              }}
            >
              <MapPin size={12} color={COLORS.amber} />
              {r.circuit}
            </div>
          )}
          <div
            style={{
              fontSize: 12,
              color: COLORS.textMuted,
              display: "flex",
              gap: 10,
              flexWrap: "wrap",
              marginTop: viewMode === "date" ? 3 : 0,
            }}
          >
            <span>
              <Calendar size={11} style={{ verticalAlign: -1, marginRight: 3 }} />
              {fmtDate(r.date)}

            <span>

              {r.temp ? ` ${r.temp}℃` : ""}
            </span>
            {(r.tireF || r.tireR) && (

          {r.memo && (

        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
          {r.bestLap && (

                fontFamily: "monospace",

function CustomTab({ records, setRecords, highlightId, onHighlightHandled }) {
  const blankForm = {
    date: new Date().toISOString().slice(0, 10),
    category: CUSTOM_CATEGORIES[0],
    part: "",
    brand: "",
    cost: "",
    memo: "",
  };
  const [form, setForm] = useState(blankForm);
  const [error, setError] = useState("");
  const [showForm, setShowForm] = useState(false);
  const [editingId, setEditingId] = useState(null);
  const [flashId, setFlashId] = useState(null);
  const cardRefs = useRef({});

  useEffect(() => {
    if (!highlightId) return;
    const el = cardRefs.current[highlightId];
    if (el) {
      el.scrollIntoView({ behavior: "smooth", block: "center" });
    }
    setFlashId(highlightId);
    const t = setTimeout(() => setFlashId(null), 1800);
    if (onHighlightHandled) onHighlightHandled();
    return () => clearTimeout(t);
  }, [highlightId]);

  const startEdit = (r) => {
    setForm({
      date: r.date,
      category: r.category,
      part: r.part,
      brand: r.brand || "",
      cost: r.cost || "",
      memo: r.memo || "",
    });
    setEditingId(r.id);
    setError("");
    setShowForm(true);
  };

  const startAdd = () => {
    setForm(blankForm);
    setEditingId(null);
    setError("");
    setShowForm(true);
  };

  const save = () => {
    if (!form.part.trim()) {
      setError("パーツ名を入力してください");
      return;
    }
    setError("");
    if (editingId) {
      setRecords(records.map((r) => (r.id === editingId ? { ...r, ...form } : r)));
    } else {
      setRecords([{ id: uid(), ...form }, ...records]);
    }
    setForm(blankForm);
    setEditingId(null);
    setShowForm(false);
  };

  const remove = (id) => setRecords(records.filter((r) => r.id !== id));

  const sorted = [...records].sort((a, b) => (a.date < b.date ? 1 : -1));
  const grouped = CUSTOM_CATEGORIES.map((cat) => ({
    cat,
    items: sorted.filter((r) => r.category === cat),
  })).filter((g) => g.items.length > 0);
  const totalCost = records.reduce((s, r) => s + (Number(r.cost) || 0), 0);

  return (
    <div>
      <div
        style={{
          display: "flex",
          alignItems: "center",
          justifyContent: "space-between",
          marginBottom: 14,
        }}
      >
        <div>
          <div style={{ fontSize: 20, fontWeight: 700 }}>
            {records.length}
            <span style={{ fontSize: 12, color: COLORS.textMuted, marginLeft: 4 }}>
              点装着中
            </span>
          </div>
          {totalCost > 0 && (
            <div
              style={{
                fontSize: 12,
                color: COLORS.amber,
                fontFamily: "monospace",
                marginTop: 2,
              }}
            >
              累計 ¥{totalCost.toLocaleString()}
            </div>
          )}
        </div>
        <button
          onClick={() => (showForm ? setShowForm(false) : startAdd())}
          style={{
            background: showForm ? COLORS.surfaceRaised : COLORS.red,
            border: `1px solid ${showForm ? COLORS.border : COLORS.red}`,
            color: "#fff",
            borderRadius: 7,
            padding: "9px 14px",
            fontSize: 13,
            fontWeight: 700,
            display: "flex",
            alignItems: "center",
            gap: 5,
            cursor: "pointer",
          }}
        >
          <Plus size={15} />
          カスタムを追加
        </button>
      </div>

      {showForm && (
        <div
          style={{
            background: COLORS.surface,
            border: `1px solid ${COLORS.border}`,
            borderRadius: 10,
            padding: 14,
            marginBottom: 16,
          }}
        >
          {editingId && (
            <div
              style={{
                fontSize: 12,
                color: COLORS.amber,
                marginBottom: 10,
                fontWeight: 600,
              }}
            >
              編集中
            </div>
          )}
          <div style={{ display: "flex", gap: 10 }}>
            <div style={{ flex: 1 }}>
              <Field label="装着日">
                <input
                  type="date"
                  value={form.date}
                  onChange={(e) => setForm({ ...form, date: e.target.value })}
                  style={inputStyle}
                />
              </Field>
            </div>
            <div style={{ flex: 1 }}>
              <Field label="カテゴリー">
                <select
                  value={form.category}
                  onChange={(e) => setForm({ ...form, category: e.target.value })}
                  style={inputStyle}
                >
                  {CUSTOM_CATEGORIES.map((c) => (
                    <option key={c} value={c}>
                      {c}
                    </option>
                  ))}
                </select>
              </Field>
            </div>
          </div>

          <Field label="パーツ名">
            <input
              value={form.part}
              onChange={(e) => {
                setForm({ ...form, part: e.target.value });
                if (error) setError("");
              }}
              style={inputStyle}
              placeholder="例: BLITZ 車高調"
            />
            {error && (
              <div style={{ color: "#e08585", fontSize: 12, marginTop: 6 }}>
                {error}
              </div>
            )}
          </Field>

          <div style={{ display: "flex", gap: 10 }}>
            <div style={{ flex: 1 }}>
              <Field label="ブランド/メーカー">
                <input
                  value={form.brand}
                  onChange={(e) => setForm({ ...form, brand: e.target.value })}
                  style={inputStyle}
                  placeholder="任意"
                />
              </Field>
            </div>
            <div style={{ flex: 1 }}>
              <Field label="費用 (円)">
                <input
                  type="number"
                  value={form.cost}
                  onChange={(e) => setForm({ ...form, cost: e.target.value })}
                  style={inputStyle}
                  placeholder="任意"
                />
              </Field>
            </div>
          </div>

          <Field label="メモ">
            <input
              value={form.memo}
              onChange={(e) => setForm({ ...form, memo: e.target.value })}
              style={inputStyle}
              placeholder="セッティング内容など"
            />
          </Field>

          <button
            onClick={save}
            style={{
              width: "100%",
              background: COLORS.red,
              border: "none",
              color: "#fff",
              borderRadius: 7,
              padding: "10px 0",
              fontSize: 14,
              fontWeight: 700,
              display: "flex",
              alignItems: "center",
              justifyContent: "center",
              gap: 6,
              cursor: "pointer",
            }}
          >
            <Plus size={16} />
            {editingId ? "更新する" : "保存する"}
          </button>
        </div>
      )}

      {sorted.length === 0 && <EmptyState text="カスタム内容はまだ登録されていません" />}

      {grouped.map((g) => (
        <div key={g.cat} style={{ marginBottom: 14 }}>
          <div
            style={{
              fontSize: 11,
              color: COLORS.textMuted,
              marginBottom: 6,
              display: "flex",
              alignItems: "center",
              gap: 5,
            }}
          >
            <Tag size={11} />
            {g.cat}
          </div>
          {g.items.map((r) => (
            <div
              key={r.id}
              ref={(el) => (cardRefs.current[r.id] = el)}
              onClick={() => startEdit(r)}
              style={{
                background: COLORS.surface,
                border: `1px solid ${flashId === r.id ? COLORS.amber : COLORS.border}`,
                borderRadius: 10,
                padding: 12,
                marginBottom: 8,
                cursor: "pointer",
                transition: "border-color 0.3s",
              }}
            >
              <div
                style={{
                  display: "flex",
                  justifyContent: "space-between",
                  alignItems: "flex-start",
                }}
              >
                <div>
                  <div style={{ fontWeight: 700, fontSize: 14, marginBottom: 2 }}>
                    {r.part}
                  </div>
                  <div
                    style={{
                      fontSize: 12,
                      color: COLORS.textMuted,
                      display: "flex",
                      gap: 10,
                      flexWrap: "wrap",
                    }}
                  >
                    {r.brand && <span>{r.brand}</span>}
                    <span>
                      <Calendar
                        size={11}
                        style={{ verticalAlign: -1, marginRight: 3 }}
                      />
                      {fmtDate(r.date)}

                  </div>
                  {r.memo && (
                    <div
                      style={{ fontSize: 12, color: COLORS.textMuted, marginTop: 4 }}

                      {r.memo}

                  )}
                </div>
                <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                  {r.cost && (
                    <span

                      ¥{Number(r.cost).toLocaleString()}

                      e.stopPropagation();
                      remove(r.id);
                    }}

                      background: "transparent",

                      color: COLORS.textMuted,
                      cursor: "pointer",

function MainApp() {
  const [tab, setTab] = useState("maint");
  const [loaded, setLoaded] = useState(false);
  const [mileage, setMileage] = useState(0);
  const [maintRecords, setMaintRecords] = useState([]);
  const [circuitRecords, setCircuitRecords] = useState([]);
  const [customRecords, setCustomRecords] = useState([]);
  const [showModPopup, setShowModPopup] = useState(false);
  const [highlightModId, setHighlightModId] = useState(null);

  useEffect(() => {
    let cancelled = false;

    (async () => {
      const data = await loadAppData();
      if (cancelled) return;

      setMileage(Number(data["nd-mileage"]) || 0);
      setMaintRecords(data["nd-maint-records"] || []);
      setCircuitRecords(data["nd-circuit-records"] || []);
      setCustomRecords(data["nd-custom-records"] || []);
      setLoaded(true);
    })();

    return () => { cancelled = true; };
  }, []);

  useEffect(() => {
    if (!loaded) return;
    saveAppValue("nd-mileage", mileage);
  }, [mileage, loaded]);

  useEffect(() => {
    if (!loaded) return;
    saveAppValue("nd-maint-records", maintRecords);
  }, [maintRecords, loaded]);

  useEffect(() => {
    if (!loaded) return;
    saveAppValue("nd-circuit-records", circuitRecords);
  }, [circuitRecords, loaded]);

  useEffect(() => {
    if (!loaded) return;
    saveAppValue("nd-custom-records", customRecords);
  }, [customRecords, loaded]);

  const hasOilChange = (r) => {
    if (r.items) return r.items.some((it) => it.category === "エンジンオイル交換");
    if (r.categories) return r.categories.includes("エンジンオイル交換");
    return r.category === "エンジンオイル交換";
  };
  const lastOil = maintRecords
    .filter(hasOilChange)
    .sort((a, b) => (b.mileage || 0) - (a.mileage || 0))[0];
  const oilDueAt = lastOil ? (lastOil.mileage || 0) + 5000 : null;
  const oilRemain = oilDueAt !== null ? oilDueAt - mileage : null;

  const totalCost = maintRecords.reduce((s, r) => s + (Number(r.cost) || 0), 0);
  const trackDays = circuitRecords.length;

  return (
    <div
      style={{
        background: COLORS.bg,
        color: COLORS.text,
        minHeight: "100vh",
        fontFamily:
          "'Hiragino Sans', 'Yu Gothic', system-ui, -apple-system, sans-serif",
        paddingBottom: 40,
      }}
    >
      <Header mileage={mileage} setMileage={setMileage} />

      <div style={{ padding: "0 16px" }}>
        <SummaryStrip
          oilRemain={oilRemain}
          totalCost={totalCost}
          trackDays={trackDays}
          modCount={customRecords.length}
          onModClick={() => setShowModPopup(true)}
        />

        <TabBar tab={tab} setTab={setTab} />

        {tab === "maint" && (
          <MaintTab
            records={maintRecords}
            setRecords={setMaintRecords}
            mileage={mileage}
          />
        )}
        {tab === "circuit" && (
          <CircuitTab records={circuitRecords} setRecords={setCircuitRecords} />
        )}
        {tab === "custom" && (
          <CustomTab
            records={customRecords}
            setRecords={setCustomRecords}
            highlightId={highlightModId}
            onHighlightHandled={() => setHighlightModId(null)}
          />
        )}
      </div>

      {showModPopup && (
        <ModPopup
          records={customRecords}
          onClose={() => setShowModPopup(false)}
          onSelect={(id) => {
            setHighlightModId(id);
            setTab("custom");
            setShowModPopup(false);
          }}
        />
      )}
    </div>
  );
}

  );
}

/* ---- storage helpers (GitHub Pages + GAS backend) ----
   画面は静的ホスティング、GASはGoogle Driveへの同期APIとして使用。
   端末側にもlocalStorageバックアップを保持します。
*/
const STORAGE_KEYS = [
  "nd-mileage",
  "nd-maint-records",
  "nd-circuit-records",
  "nd-custom-records",
];
const API_URL_KEY = "nd-gas-api-url";
const SYNC_KEY_KEY = "nd-gas-sync-key";

function loadJSON(key, fallback) {
  try {
    const v = localStorage.getItem(key);
    return v ? JSON.parse(v) : fallback;
  } catch (e) {
    return fallback;
  }
}

function saveJSON(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
}

function getLocalSnapshot() {
  return {
    "nd-mileage": Number(localStorage.getItem("nd-mileage")) || 0,
    "nd-maint-records": loadJSON("nd-maint-records", []),
    "nd-circuit-records": loadJSON("nd-circuit-records", []),
    "nd-custom-records": loadJSON("nd-custom-records", []),
  };
}

function getApiConfig() {
  return {
    url: (localStorage.getItem(API_URL_KEY) || "").trim(),
    key: (localStorage.getItem(SYNC_KEY_KEY) || "").trim(),
  };
}

function normalizeGasUrl(url) {
  url = String(url || "").trim();
  if (!url) return "";
  // /dev ではなく公開用 /exec を使う。
  return url.replace(/\/dev(?:\?.*)?$/, "/exec");
}

function ensureApiConfig() {
  let cfg = getApiConfig();
  if (cfg.url && cfg.key) return cfg;

  const url = window.prompt(
    "Roadster Logの同期設定\\n\\nApps ScriptのウェブアプリURL（/execで終わるURL）を貼り付けてください。\\nあとでキャンセルして端末保存だけで使うこともできます。",
    cfg.url || ""
  );
  if (!url) return cfg;

  const key = window.prompt(
    "Code.gsに設定したSYNC_KEYを入力してください。",
    cfg.key || ""
  );
  if (!key) return cfg;

  cfg = { url: normalizeGasUrl(url), key: key.trim() };
  localStorage.setItem(API_URL_KEY, cfg.url);
  localStorage.setItem(SYNC_KEY_KEY, cfg.key);
  return cfg;
}

// 設定をやり直したい時にSafariのアドレス末尾へ ?sync=reset を付けて開く。
(function handleSyncReset() {
  try {
    const q = new URLSearchParams(location.search);
    if (q.get("sync") === "reset") {
      localStorage.removeItem(API_URL_KEY);
      localStorage.removeItem(SYNC_KEY_KEY);
    }
  } catch (e) {}
})();

function jsonpLoad(url, syncKey) {
  return new Promise((resolve, reject) => {
    const cb = "__ndJsonp_" + Date.now() + "_" + Math.random().toString(36).slice(2);
    const script = document.createElement("script");
    const timer = setTimeout(() => cleanup(new Error("同期読込がタイムアウトしました")), 12000);

    function cleanup(err, value) {
      clearTimeout(timer);
      try { delete window[cb]; } catch (e) { window[cb] = undefined; }
      if (script.parentNode) script.parentNode.removeChild(script);
      err ? reject(err) : resolve(value);
    }

    window[cb] = (result) => cleanup(null, result);
    script.onerror = () => cleanup(new Error("同期サーバーへ接続できませんでした"));
    script.src = url + (url.includes("?") ? "&" : "?") +
      "action=load&callback=" + encodeURIComponent(cb) +
      "&syncKey=" + encodeURIComponent(syncKey) +
      "&_=" + Date.now();
    document.head.appendChild(script);
  });
}

function postToGas(params) {
  const cfg = getApiConfig();
  if (!cfg.url || !cfg.key) return;

  let iframe = document.getElementById("nd-sync-frame");
  if (!iframe) {
    iframe = document.createElement("iframe");
    iframe.id = "nd-sync-frame";
    iframe.name = "nd-sync-frame";
    iframe.style.display = "none";
    document.body.appendChild(iframe);
  }

  const form = document.createElement("form");
  form.method = "POST";
  form.action = cfg.url;
  form.target = "nd-sync-frame";
  form.style.display = "none";

  const payload = { ...params, syncKey: cfg.key };
  Object.entries(payload).forEach(([k, v]) => {
    const input = document.createElement("input");
    input.type = "hidden";
    input.name = k;
    input.value = typeof v === "string" ? v : JSON.stringify(v);
    form.appendChild(input);
  });

  document.body.appendChild(form);
  form.submit();
  setTimeout(() => form.remove(), 1000);
}

function hasMeaningfulData(data) {
  return STORAGE_KEYS.some((key) => {
    const value = data && data[key];
    return Array.isArray(value) ? value.length > 0 : Number(value) > 0;
  });
}

function copyToLocal(data) {
  STORAGE_KEYS.forEach((key) => {
    if (!(key in data)) return;
    if (key === "nd-mileage") {
      try { localStorage.setItem(key, String(data[key] || 0)); } catch (e) {}
    } else {
      saveJSON(key, data[key]);
    }
  });
}

async function loadAppData() {
  const local = getLocalSnapshot();
  const cfg = ensureApiConfig();
  if (!cfg.url || !cfg.key) return local;

  try {
    const result = await jsonpLoad(cfg.url, cfg.key);
    if (!result || !result.ok) {
      console.warn("Drive同期を開始できませんでした:", result && result.error);
      return local;
    }

    const serverData = result.data || {};
    if (!hasMeaningfulData(serverData) && hasMeaningfulData(local)) {
      postToGas({ action: "saveAll", data: JSON.stringify(local) });
      return local;
    }

    copyToLocal(serverData);
    return { ...local, ...serverData };
  } catch (err) {
    console.warn("Drive読込に失敗。端末バックアップを使用します。", err);
    return local;
  }
}

function saveAppValue(key, value) {
  // 端末側には即保存。
  if (key === "nd-mileage") {
    try { localStorage.setItem(key, String(value || 0)); } catch (e) {}
  } else {
    saveJSON(key, value);
  }

  // GASへは通常のHTMLフォームPOSTで送信（クロスオリジンでも送信可能）。
  const cfg = getApiConfig();
  if (!cfg.url || !cfg.key) return;
  postToGas({ action: "saveValue", key, value: JSON.stringify(value) });
}

/* ---- launch splash screen: ND roadster illustration, auto-advances ---- */

function Splash({ onDone }) {
  useEffect(() => {
    const t = setTimeout(onDone, 2200);
    return () => clearTimeout(t);
  }, []);

  const isNarrowPortrait =
    typeof window !== "undefined" &&
    window.innerWidth <= 640 &&
    window.innerHeight > window.innerWidth;

  return (
    <div
      onClick={onDone}
      style={{
        position: "fixed",
        inset: 0,
        cursor: "pointer",
        animation: "nd-fade-in 0.5s ease",
        overflow: "hidden",
      }}
    >
      <div
        style={{
          position: "absolute",
          inset: 0,
          backgroundColor: COLORS.bg,
          backgroundImage: `url(${SPLASH_PHOTO})`,
          backgroundSize: isNarrowPortrait ? "contain" : "cover",
          backgroundRepeat: "no-repeat",
          backgroundPosition: isNarrowPortrait ? "center center" : "center 40%",
          animation: isNarrowPortrait
            ? "nd-fade-in 1.2s ease"
            : "nd-photo-in 1.6s cubic-bezier(.2,.8,.2,1)",
        }}
      />
      <div
        style={{
          position: "absolute",
          inset: 0,
          background:
            "linear-gradient(180deg, rgba(21,21,23,0.55) 0%, rgba(21,21,23,0.15) 30%, rgba(21,21,23,0.25) 55%, rgba(21,21,23,0.97) 92%)",
        }}
      />
      <div
        style={{
          position: "absolute",
          left: 0,
          right: 0,
          bottom: 60,
          textAlign: "center",
        }}
      >
        <div
          style={{
            fontSize: 24,
            fontWeight: 700,
            color: COLORS.text,
            letterSpacing: 2,
            textShadow: "0 2px 10px rgba(0,0,0,0.5)",
          }}
        >
          MX-5 ND
        </div>
        <div
          style={{
            fontSize: 12,
            color: COLORS.textMuted,
            letterSpacing: 3,
            marginTop: 4,
            textTransform: "uppercase",
          }}
        >
          Roadster Log
        </div>
        <div
          style={{
            width: 6,
            height: 6,
            borderRadius: "50%",
            background: COLORS.red,
            margin: "18px auto 0",
            animation: "nd-pulse 1.2s ease-in-out infinite",
          }}
        />
      </div>
    </div>
  );
}

function App() {
  const [booted, setBooted] = useState(false);
  if (!booted) return <Splash onDone={() => setBooted(true)} />;
  return <MainApp />;
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);

</script>
